      // ==========================================================================
      // Web Audio API & スペアナ (スペクトラムアナライザー) & 再生モード制御
      // ==========================================================================
      function updateAudioModeUI() {
        if (!btnAudioMode) return;
        if (audioMode === 'direct') {
          audioModeIcon.textContent = '🎧';
          audioModeText.textContent = 'スリープ対応';
          btnAudioMode.classList.remove('active');
          btnAudioMode.title = 'ダイレクト再生モード（画面スリープ・別アプリ時も音が鳴り続けます）。タップでリアルスペアナへ';
        } else {
          audioModeIcon.textContent = '📊';
          audioModeText.textContent = 'リアルスペアナ';
          btnAudioMode.classList.add('active');
          btnAudioMode.title = 'リアルスペアナモード（Web Audio API周波数解析）。タップでスリープ対応へ';
        }
      }

      function recreateAudioElement() {
        const oldAudio = audio;
        const wasPaused = oldAudio.paused;
        const curTime = oldAudio.currentTime;
        const curSrc = oldAudio.src;
        const curVol = oldAudio.volume;

        // Web Audio リソースを安全に切断・解放
        if (sourceNode) {
          try { sourceNode.disconnect(); } catch (_) {}
          sourceNode = null;
        }
        if (analyser) {
          try { analyser.disconnect(); } catch (_) {}
          analyser = null;
        }
        if (audioCtx) {
          try {
            audioCtx.close();
          } catch (_) {}
          audioCtx = null;
        }

        try {
          oldAudio.pause();
          oldAudio.removeAttribute('src');
          oldAudio.load();
        } catch (_) {}

        // 新しいAudio要素を作成（Web Audio非接続のネイティブ直接出力ルートを復元）
        const newAudio = document.createElement('audio');
        newAudio.id = 'audio-player';
        newAudio.preload = 'metadata';
        newAudio.volume = curVol;

        if (oldAudio.parentNode) {
          oldAudio.parentNode.replaceChild(newAudio, oldAudio);
        }
        audio = newAudio;
        attachAudioEventListeners(audio);

        if (curSrc) {
          audio.src = curSrc;
          audio.currentTime = curTime;
          if (!wasPaused) {
            audio.play().catch(e => console.warn('再生成後の自動再生:', e));
          }
        }
      }

      function toggleAudioMode() {
        if (audioMode === 'direct') {
          audioMode = 'real';
          localStorage.setItem(STORAGE_KEY_AUDIO_MODE, 'real');
          updateAudioModeUI();
          initAudioContext();
          showToast('📊 リアルスペアナモードに切り替えました');
        } else {
          audioMode = 'direct';
          localStorage.setItem(STORAGE_KEY_AUDIO_MODE, 'direct');
          updateAudioModeUI();
          recreateAudioElement();
          showToast('🎧 スリープ対応ダイレクト再生に切り替えました');
        }
      }

      if (btnAudioMode) {
        btnAudioMode.addEventListener('click', toggleAudioMode);
      }

      function initAudioContext() {
        // ダイレクト再生モードの場合はWeb Audio APIを経由させない（iOSスリープ対策）
        if (audioMode === 'direct') {
          return;
        }

        if (audioCtx) {
          if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
          }
          return;
        }

        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64; // モバイル向けに軽量かつ美しい解像度
          sourceNode = audioCtx.createMediaElementSource(audio);
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
          
          if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
          }
        } catch (e) {
          console.warn('AudioContext初期化エラー (環境の制限):', e);
        }
      }

      function startVisualizer() {
        if (visualizerAnimId) return; // 既にループ中

        const bufferLength = 32;
        const dataArray = new Uint8Array(bufferLength);

        function draw() {
          // バックグラウンド・スリープ時は描画ループを完全に停止しCPU負荷をゼロに保つ
          if (document.hidden) {
            visualizerAnimId = null;
            return;
          }

          visualizerAnimId = requestAnimationFrame(draw);

          // 描画サイズをコンテナの横幅に動的同期（ワイド画面での解像度ぼやけ防止）
          if (visualizerCanvas.clientWidth && visualizerCanvas.width !== visualizerCanvas.clientWidth) {
            visualizerCanvas.width = visualizerCanvas.clientWidth;
          }

          const width = visualizerCanvas.width;
          const height = visualizerCanvas.height;

          // 背景クリア（ダークウッド）
          canvasCtx.fillStyle = '#23160a';
          canvasCtx.fillRect(0, 0, width, height);

          if (audio.paused) {
            // アイドル時の落ち着いたフラットライン
            canvasCtx.fillStyle = '#6a4a28';
            canvasCtx.fillRect(0, height - 3, width, 2);
            return;
          }

          const barCount = Math.max(28, Math.min(64, Math.floor(width / 13)));
          const barWidth = (width / barCount) - 2;
          let x = 1;

          if (audioMode === 'real' && analyser) {
            // --- リアルスペアナ (Web Audio API FFT解析) ---
            analyser.getByteFrequencyData(dataArray);

            for (let i = 0; i < barCount; i++) {
              const dataIndex = Math.floor(i * (dataArray.length / barCount));
              const barHeight = ((dataArray[dataIndex] || 0) / 255) * (height - 4);

              const grad = canvasCtx.createLinearGradient(0, height, 0, height - barHeight);
              grad.addColorStop(0, '#caa06d');
              grad.addColorStop(0.5, '#ffaa2a');
              grad.addColorStop(1, '#ffe08a');

              canvasCtx.fillStyle = grad;
              canvasCtx.fillRect(x, height - barHeight - 2, barWidth, barHeight + 2);
              x += barWidth + 2;
            }
          } else {
            // --- ダイレクト再生モード用 疑似スペアナアニメーション ---
            // Web Audio API を一切使用しないため iOS スリープ・バックグラウンド再生が100%持続
            const now = performance.now() * 0.005;
            const curT = audio.currentTime;

            for (let i = 0; i < barCount; i++) {
              const normI = i / barCount;
              // 低域〜中域にピークのある音楽的エンベロープ
              const baseCurve = Math.pow(1 - normI * 0.65, 1.3);
              const beat1 = Math.sin(curT * 4.3 + normI * 6.28);
              const beat2 = Math.cos(curT * 2.1 - normI * 3.14);
              const wave = Math.sin(now * 1.6 + i * 0.45) * 0.3 + Math.sin(now * 3.1 - i * 0.25) * 0.2;
              const val = Math.max(0.08, (0.45 + 0.32 * beat1 + 0.22 * beat2 + wave) * baseCurve);
              const barHeight = Math.min(height - 4, Math.max(3, val * (height - 4)));

              const grad = canvasCtx.createLinearGradient(0, height, 0, height - barHeight);
              grad.addColorStop(0, '#caa06d');
              grad.addColorStop(0.5, '#ffaa2a');
              grad.addColorStop(1, '#ffe08a');

              canvasCtx.fillStyle = grad;
              canvasCtx.fillRect(x, height - barHeight - 2, barWidth, barHeight + 2);
              x += barWidth + 2;
            }
          }
        }

        visualizerAnimId = requestAnimationFrame(draw);
      }

      // ==========================================================================
      // ファイルシステム & フォルダ解析
      // ==========================================================================
      function parseFiles(files) {
        if (!files || files.length === 0) return;

        fileTree.clear();
        playlist = [];

        // ディレクトリを確実にツリーに登録するための再帰登録
        function ensureDirExists(dirPath) {
          if (!dirPath) return;
          if (fileTree.has(dirPath)) return;

          const parts = dirPath.split('/');
          const dirName = parts[parts.length - 1];
          const parentPath = parts.slice(0, -1).join('/');

          ensureDirExists(parentPath);

          fileTree.set(dirPath, {
            name: dirName,
            path: dirPath,
            isDir: true,
            parentPath: parentPath
          });
        }

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          // webkitRelativePath があればそれを使う、なければ name のみ
          const fullPath = file.webkitRelativePath || file.name;
          const parts = fullPath.split('/');

          if (parts.length > 1) {
            const dirPath = parts.slice(0, -1).join('/');
            ensureDirExists(dirPath);
          }

          if (isAudioFile(file.name)) {
            const parentPath = parts.length > 1 ? parts.slice(0, -1).join('/') : '';
            const initialTrackNo = parseTrackNumberFromFilename(file.name);
            const trackItem = {
              name: file.name,
              path: fullPath,
              isDir: false,
              fileObj: file,
              parentPath: parentPath,
              trackNo: initialTrackNo,
              title: cleanTrackName(file.name),
              artist: parentPath || 'ルート',
              tagParsed: false
            };
            fileTree.set(fullPath, trackItem);
            playlist.push(trackItem);
          }
        }

        if (playlist.length === 0) {
          showToast('音楽ファイルが見つかりませんでした');
          renderList();
          return;
        }

        // フォルダ別・優先順ソート（1: トラックNo昇順, 2: ファイル名昇順）
        sortPlaylist();

        // ルート階層または前回開いていたフォルダ階層を復帰
        const savedFolder = localStorage.getItem(STORAGE_KEY_FOLDER);
        if (savedFolder && (fileTree.has(savedFolder) || Array.from(fileTree.values()).some(it => it.parentPath === savedFolder))) {
          currentPath = savedFolder;
        } else {
          currentPath = '';
        }

        renderList();
        showToast(`${playlist.length}曲のファイルを読み込みました`);
      }

      // プレイリスト全体のソート（フォルダ順、フォルダ内は優先順位1: トラックNo昇順, 2: ファイル名昇順）
      function sortPlaylist() {
        const currentPlayingPath = (currentTrackIndex >= 0 && playlist[currentTrackIndex]) ? playlist[currentTrackIndex].path : null;
        playlist.sort((a, b) => {
          if (a.parentPath !== b.parentPath) {
            return (a.parentPath || '').localeCompare(b.parentPath || '', undefined, { numeric: true, sensitivity: 'base' });
          }
          return compareTracks(a, b);
        });
        if (currentPlayingPath) {
          currentTrackIndex = playlist.findIndex(t => t.path === currentPlayingPath);
        }
      }

      // フォルダ内楽曲のタグ（トラック名・アーティスト名・トラックNo）を順次非同期解析してDOM更新
      async function fetchTagsForFiles(filesToParse) {
        for (const track of filesToParse) {
          if (!track.tagParsed) {
            extractTrackMetadata(track.fileObj).then((meta) => {
              track.tagParsed = true;
              let trackNoUpdated = false;
              if (meta.title) track.title = meta.title;
              if (meta.artist) track.artist = meta.artist;
              if (meta.trackNo != null && meta.trackNo !== track.trackNo) {
                track.trackNo = meta.trackNo;
                trackNoUpdated = true;
              }

              // 一致するDOM要素があればテキストを即時更新
              const escapedPath = CSS.escape ? CSS.escape(track.path) : track.path;
              const li = fileListEl.querySelector(`li[data-track-path="${escapedPath}"]`);
              if (li) {
                const titleEl = li.querySelector('.file-title');
                const metaEl = li.querySelector('.file-meta');
                if (titleEl) titleEl.textContent = formatTrackDisplayTitle(track);
                if (metaEl) metaEl.textContent = track.artist;
              }

              // 再生中の曲であればプレイヤー情報も更新
              if (currentTrackIndex >= 0 && playlist[currentTrackIndex]?.path === track.path) {
                updateTrackInfoUI(track);
                setupMediaSession(track);
              }

              // トラック番号の更新によって曲順が変動した場合はソートとリストを再構成
              if (trackNoUpdated) {
                sortPlaylist();
                renderList();
              }
            }).catch(() => {
              track.tagParsed = true;
            });
          }
        }
      }

      // ファイルリストのレンダリング
      function renderList() {
        // 空状態チェック
        if (fileTree.size === 0) {
          emptyStateEl.style.display = 'block';
          fileListEl.style.display = 'none';
          btnUp.disabled = true;
          renderBreadcrumbs();
          return;
        }

        emptyStateEl.style.display = 'none';
        fileListEl.style.display = 'flex';
        fileListEl.innerHTML = '';

        // 親階層ボタンの状態
        btnUp.disabled = (currentPath === '');

        // パンくずの更新
        renderBreadcrumbs();

        // 現在の階層の子要素を取得
        const dirs = [];
        const files = [];

        fileTree.forEach((item) => {
          if (item.parentPath === currentPath) {
            if (item.isDir) dirs.push(item);
            else files.push(item);
          }
        });

        // ソート（フォルダは名前順、曲は優先度1: トラックNo昇順、優先度2: ファイル名昇順）
        dirs.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        files.sort(compareTracks);

        // フォルダ要素の描画
        dirs.forEach((dir) => {
          const li = document.createElement('li');
          li.className = 'file-item is-folder';
          li.innerHTML = `
            <div class="file-icon folder-icon">
              <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
            </div>
            <div class="file-info">
              <div class="file-title">${escapeHtml(dir.name)}</div>
              <div class="file-meta">フォルダ</div>
            </div>
            <svg style="width:20px;height:20px;fill:var(--wood-dark);" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          `;
          li.addEventListener('click', () => {
            currentPath = dir.path;
            localStorage.setItem(STORAGE_KEY_FOLDER, currentPath);
            renderList();
          });
          fileListEl.appendChild(li);
        });

        // 曲要素の描画（優先順位順、トラック番号付きトラック名・アーティスト名を表示）
        files.forEach((fileItem) => {
          const isCurrentlyPlaying = (currentTrackIndex >= 0 && playlist[currentTrackIndex]?.path === fileItem.path);
          const li = document.createElement('li');
          li.className = `file-item is-song ${isCurrentlyPlaying ? 'playing' : ''}`;
          li.setAttribute('data-track-path', fileItem.path);
          
          li.innerHTML = `
            <div class="file-icon song-icon">
              <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
            <div class="file-info">
              <div class="file-title">${escapeHtml(formatTrackDisplayTitle(fileItem))}</div>
              <div class="file-meta">${escapeHtml(fileItem.artist)}</div>
            </div>
            ${isCurrentlyPlaying ? `
              <div class="playing-indicator">
                <span></span><span></span><span></span>
              </div>
            ` : ''}
          `;

          li.addEventListener('click', () => {
            const idx = playlist.findIndex(p => p.path === fileItem.path);
            if (idx !== -1) {
              playTrackByIndex(idx);
            }
          });

          fileListEl.appendChild(li);
        });

        // 現在表示されている曲のタグ（トラック名・アーティスト名・トラックNo）を非同期解析
        fetchTagsForFiles(files);
      }

      function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, function(m) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          }[m];
        });
      }

      // パンくずリスト更新
      function renderBreadcrumbs() {
        breadcrumbsEl.innerHTML = '';
        const rootSpan = document.createElement('span');
        rootSpan.className = 'crumb-item';
        rootSpan.textContent = '🏠 /';
        rootSpan.addEventListener('click', () => {
          currentPath = '';
          localStorage.setItem(STORAGE_KEY_FOLDER, '');
          renderList();
        });
        breadcrumbsEl.appendChild(rootSpan);

        if (!currentPath) return;

        const parts = currentPath.split('/');
        let accumPath = '';

        parts.forEach((part) => {
          accumPath = accumPath ? `${accumPath}/${part}` : part;
          const target = accumPath;

          const sep = document.createElement('span');
          sep.className = 'crumb-separator';
          sep.textContent = '/';
          breadcrumbsEl.appendChild(sep);

          const crumb = document.createElement('span');
          crumb.className = 'crumb-item';
          crumb.textContent = part;
          crumb.addEventListener('click', () => {
            currentPath = target;
            localStorage.setItem(STORAGE_KEY_FOLDER, target);
            renderList();
          });
          breadcrumbsEl.appendChild(crumb);
        });

        breadcrumbsEl.scrollLeft = breadcrumbsEl.scrollWidth;
      }

      // ==========================================================================
      // [ 🏠 トップ ] ボタン 長押し判定 (通常タップ: ルートへ / 長押し: フォルダ選択ダイアログ)
      // ==========================================================================
      let longPressTimer = null;
      let isLongPressed = false;
      const LONG_PRESS_DURATION = 900; // ms

      function triggerFolderDialog() {
        folderPickerInput.value = '';
        folderPickerInput.click();
      }

      function startLongPress(e) {
        isLongPressed = false;
        homeLongPressBar.style.transition = `width ${LONG_PRESS_DURATION}ms linear`;
        homeLongPressBar.style.width = '100%';

        longPressTimer = setTimeout(() => {
          isLongPressed = true;
          // バイブレーション (対応端末のみ)
          if (navigator.vibrate) navigator.vibrate(50);
          showToast('長押し検知：指を離すとフォルダ選択を開きます');
        }, LONG_PRESS_DURATION);
      }

      function endLongPress(e) {
        clearTimeout(longPressTimer);
        homeLongPressBar.style.transition = 'width 0.15s ease';
        homeLongPressBar.style.width = '0%';

        if (isLongPressed) {
          isLongPressed = false;
          // ユーザーの指離し操作（直接のユーザー操作イベント）の中でダイアログを起動
          // これによりiOS Safari等の非同期ポップアップブロックを完全に回避
          triggerFolderDialog();
        } else {
          // 通常タップ: ルートへジャンプ
          currentPath = '';
          localStorage.setItem(STORAGE_KEY_FOLDER, '');
          renderList();
        }
      }

      function cancelLongPress() {
        clearTimeout(longPressTimer);
        isLongPressed = false;
        homeLongPressBar.style.transition = 'width 0.15s ease';
        homeLongPressBar.style.width = '0%';
      }

      // ポインターイベント対応（iOS Safariのイベントロスト防止にPointerCaptureを活用）
      btnHome.addEventListener('pointerdown', (e) => {
        try { btnHome.setPointerCapture(e.pointerId); } catch (_) {}
        startLongPress(e);
      });
      btnHome.addEventListener('pointerup', (e) => {
        try { btnHome.releasePointerCapture(e.pointerId); } catch (_) {}
        endLongPress(e);
      });
      btnHome.addEventListener('pointercancel', (e) => {
        try { btnHome.releasePointerCapture(e.pointerId); } catch (_) {}
        cancelLongPress();
      });
      btnHome.addEventListener('contextmenu', (e) => e.preventDefault());

      // 1階層上へボタン
      btnUp.addEventListener('click', () => {
        if (!currentPath) return;
        const parts = currentPath.split('/');
        parts.pop();
        currentPath = parts.join('/');
        localStorage.setItem(STORAGE_KEY_FOLDER, currentPath);
        renderList();
      });

      // 読み込み完了時の共通処理（必要に応じてレジューム復帰を試行）
      function handleLoadedFiles(files, tryResume = false) {
        if (!files || files.length === 0) return;
        parseFiles(files);

        const targetFileName = localStorage.getItem(STORAGE_KEY_FILE);
        const resumeSec = parseFloat(localStorage.getItem(STORAGE_KEY_TIME) || '0');

        if (tryResume && targetFileName) {
          let matchedIndex = -1;
          for (let i = 0; i < playlist.length; i++) {
            if (playlist[i].name === targetFileName) {
              matchedIndex = i;
              break;
            }
          }

          if (matchedIndex !== -1) {
            playTrackByIndex(matchedIndex, resumeSec, false);
            const resumeTrack = playlist[matchedIndex];
            showToast(`「${formatTrackDisplayTitle(resumeTrack)}」を${formatTime(resumeSec)}で待機しました`);
          } else {
            showToast('前回の曲が見つかりませんでした');
            restoreMinibarToNormal();
            if (playlist.length > 0) {
              playTrackByIndex(0, 0, false);
            }
          }
        }
      }

      // フォルダインプットの変更検知
      folderPickerInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
          handleLoadedFiles(e.target.files, false);
        }
      });

      // ファイルインプット（複数曲選択）の変更検知 (Google Drive / OneDrive対応)
      filesPickerInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
          const hasResume = !!localStorage.getItem(STORAGE_KEY_FILE) && currentTrackIndex === -1;
          handleLoadedFiles(e.target.files, hasResume);
        }
      });

      // ==========================================================================
      // 再生制御ロジック
      // ==========================================================================
      function playTrackByIndex(index, seekSeconds = 0, autoplay = true) {
        if (index < 0 || index >= playlist.length) return;

        currentTrackIndex = index;
        const track = playlist[index];

        if (audioMode === 'real') {
          initAudioContext();
        }

        // 以前のObjectURLがあれば解放
        if (audio.src && audio.src.startsWith('blob:')) {
          URL.revokeObjectURL(audio.src);
        }

        const url = URL.createObjectURL(track.fileObj);
        audio.src = url;
        audio.currentTime = seekSeconds;

        updateTrackInfoUI(track);
        renderList();

        // フォルダ階層の記憶
        if (track.parentPath !== undefined) {
          localStorage.setItem(STORAGE_KEY_FOLDER, track.parentPath);
        }

        // タグが未取得なら即座にメタデータ（トラック名・アーティスト名・トラックNo）を抽出
        if (!track.tagParsed) {
          extractTrackMetadata(track.fileObj).then((meta) => {
            track.tagParsed = true;
            let trackNoUpdated = false;
            if (meta.title) track.title = meta.title;
            if (meta.artist) track.artist = meta.artist;
            if (meta.trackNo != null && meta.trackNo !== track.trackNo) {
              track.trackNo = meta.trackNo;
              trackNoUpdated = true;
            }
            if (currentTrackIndex === index) {
              updateTrackInfoUI(track);
              setupMediaSession(track);
            }
            if (trackNoUpdated) {
              sortPlaylist();
              renderList();
            }
          }).catch(() => {
            track.tagParsed = true;
          });
        }

        // 埋め込みアートワークを非同期抽出して表示更新
        updateArtworkForTrack(track.fileObj).then(() => {
          setupMediaSession(track);
        });

        if (autoplay) {
          audio.play().then(() => {
            updatePlayPauseUI(true);
          }).catch((err) => {
            console.warn('自動再生待機:', err);
            updatePlayPauseUI(false);
          });
        } else {
          updatePlayPauseUI(false);
        }

        savePlaybackState();
      }

      function updateTrackInfoUI(track) {
        const title = formatTrackDisplayTitle(track);
        const artist = track.artist || (track.parentPath || 'ルートフォルダ');

        playerTitle.textContent = title;
        playerFolder.textContent = artist;

        minibarTitle.textContent = title;
        minibarSub.textContent = artist;

        // ミニバーのアクションボタンを通常の再生ボタンに復帰
        restoreMinibarToNormal();
      }

      function updatePlayPauseUI(isPlaying) {
        // メインボタンアイコン切り替え
        if (isPlaying) {
          mainPlayIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          btnPlayPause.classList.add('is-playing');
          minibarPlayIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          vinylDisc.classList.add('spinning');
          vinylDisc.classList.remove('paused');
        } else {
          mainPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
          btnPlayPause.classList.remove('is-playing');
          minibarPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
          vinylDisc.classList.add('paused');
        }
      }

      function togglePlayPause() {
        if (audioMode === 'real') {
          initAudioContext();
        }

        if (currentTrackIndex === -1) {
          if (playlist.length > 0) {
            playTrackByIndex(0);
          } else {
            showToast('音楽フォルダを選択してください');
          }
          return;
        }

        if (audio.paused) {
          audio.play().then(() => {
            updatePlayPauseUI(true);
          }).catch(e => console.warn(e));
        } else {
          audio.pause();
          updatePlayPauseUI(false);
        }
      }

      function stopPlayback() {
        audio.pause();
        audio.currentTime = 0;
        updatePlayPauseUI(false);
        savePlaybackState();
      }

      function playNextTrack(isAutoNext = false) {
        if (playlist.length === 0) return;

        const currentTrack = playlist[currentTrackIndex];
        const currentFolder = currentTrack ? currentTrack.parentPath : '';
        const folderTracks = playlist.filter(t => t.parentPath === currentFolder);

        if (isAutoNext) {
          // 自動遷移（曲終了時）: 同フォルダ内の曲を対象とする
          if (folderTracks.length === 0) return;

          if (isShuffle) {
            if (folderTracks.length === 1) {
              if (isRepeat) playTrackByIndex(currentTrackIndex);
              else stopPlayback();
              return;
            }
            let nextT;
            do {
              nextT = folderTracks[Math.floor(Math.random() * folderTracks.length)];
            } while (nextT.path === currentTrack?.path);
            const targetIdx = playlist.findIndex(t => t.path === nextT.path);
            if (targetIdx !== -1) playTrackByIndex(targetIdx);
          } else {
            const curIdxInFolder = folderTracks.findIndex(t => t.path === currentTrack?.path);
            const nextIdxInFolder = curIdxInFolder + 1;

            if (nextIdxInFolder < folderTracks.length) {
              // 同フォルダ内の次の曲へ
              const nextT = folderTracks[nextIdxInFolder];
              const targetIdx = playlist.findIndex(t => t.path === nextT.path);
              if (targetIdx !== -1) playTrackByIndex(targetIdx);
            } else {
              // フォルダ最後の曲が終了
              if (isRepeat) {
                // リピート有効: 同フォルダの先頭曲へループ
                const firstT = folderTracks[0];
                const targetIdx = playlist.findIndex(t => t.path === firstT.path);
                if (targetIdx !== -1) playTrackByIndex(targetIdx);
              } else {
                // リピート無効: 停止
                stopPlayback();
                showToast('フォルダ内の全曲の再生が終了しました');
              }
            }
          }
        } else {
          // 手動操作（[次へ] ボタンまたはジャケット右タップ）
          let nextIndex;
          if (isShuffle && playlist.length > 1) {
            do {
              nextIndex = Math.floor(Math.random() * playlist.length);
            } while (nextIndex === currentTrackIndex);
          } else {
            nextIndex = (currentTrackIndex + 1) % playlist.length;
          }
          playTrackByIndex(nextIndex);
        }
      }

      function playPrevTrack() {
        if (playlist.length === 0) return;

        // 3秒以上再生していれば曲頭に戻る
        if (audio.currentTime > 3) {
          audio.currentTime = 0;
          return;
        }

        let prevIndex;
        if (isShuffle && playlist.length > 1) {
          do {
            prevIndex = Math.floor(Math.random() * playlist.length);
          } while (prevIndex === currentTrackIndex);
        } else {
          prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
        }

        playTrackByIndex(prevIndex);
      }

      // イベントリスナー設定 (コントロールボタン)
      btnPlayPause.addEventListener('click', togglePlayPause);
      minibarPlayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePlayPause();
      });
      btnStop.addEventListener('click', stopPlayback);
      btnNext.addEventListener('click', () => playNextTrack(false));
      btnPrev.addEventListener('click', playPrevTrack);

      // リピートトグル（同フォルダ内ループ / 終了時停止）
      btnRepeat.classList.toggle('toggle-active', isRepeat);
      btnRepeat.addEventListener('click', () => {
        isRepeat = !isRepeat;
        btnRepeat.classList.toggle('toggle-active', isRepeat);
        localStorage.setItem(STORAGE_KEY_REPEAT, isRepeat);
        showToast(isRepeat ? 'リピート: 有効（同フォルダ内ループ）' : 'リピート: 無効（終了時停止）');
      });

      // ジャケットタップ（左スキップ・右スキップ）
      touchPrev.addEventListener('click', (e) => {
        e.stopPropagation();
        playPrevTrack();
      });
      touchNext.addEventListener('click', (e) => {
        e.stopPropagation();
        playNextTrack(false);
      });

      // シャッフルトグル
      if (isShuffle) btnShuffle.classList.add('toggle-active');
      btnShuffle.addEventListener('click', () => {
        isShuffle = !isShuffle;
        btnShuffle.classList.toggle('toggle-active', isShuffle);
        localStorage.setItem(STORAGE_KEY_SHUFFLE, isShuffle);
        showToast(isShuffle ? 'シャッフル: ON' : 'シャッフル: OFF');
      });

      // 音量スライダー
      const savedVol = localStorage.getItem(STORAGE_KEY_VOL);
      if (savedVol !== null) {
        audio.volume = parseFloat(savedVol);
        volumeSlider.value = savedVol;
      } else {
        audio.volume = 0.8;
      }
      volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value;
        localStorage.setItem(STORAGE_KEY_VOL, e.target.value);
      });

      // シークバー操作
      seekSlider.addEventListener('input', () => {
        isSeeking = true;
        currentTimeEl.textContent = formatTime(seekSlider.value);
      });

      seekSlider.addEventListener('change', () => {
        audio.currentTime = seekSlider.value;
        isSeeking = false;
        savePlaybackState();
      });

      // Audio要素イベントリスナー登録関数
      function attachAudioEventListeners(targetAudio) {
        targetAudio.addEventListener('loadedmetadata', () => {
          seekSlider.max = targetAudio.duration || 100;
          totalTimeEl.textContent = formatTime(targetAudio.duration);
        });

        let lastSaveTime = 0;
        targetAudio.addEventListener('timeupdate', () => {
          if (!isSeeking) {
            seekSlider.value = targetAudio.currentTime;
            currentTimeEl.textContent = formatTime(targetAudio.currentTime);
          }

          // 1秒ごとに状態保存
          const now = Date.now();
          if (now - lastSaveTime > 1000) {
            lastSaveTime = now;
            savePlaybackState();
          }
        });

        // 曲終了時の自動曲送り (リピート判定連動)
        targetAudio.addEventListener('ended', () => {
          playNextTrack(true);
        });

        targetAudio.addEventListener('play', () => {
          updatePlayPauseUI(true);
          startVisualizer();
        });
        targetAudio.addEventListener('pause', () => updatePlayPauseUI(false));
      }

      // 初回オーディオ要素へのイベント登録
      attachAudioEventListeners(audio);

      // ==========================================================================
      // レジューム再生 & スリープ・リロード対策
      // ==========================================================================
      function savePlaybackState() {
        if (currentTrackIndex >= 0 && playlist[currentTrackIndex]) {
          const track = playlist[currentTrackIndex];
          localStorage.setItem(STORAGE_KEY_FILE, track.name);
          localStorage.setItem(STORAGE_KEY_TIME, audio.currentTime.toFixed(1));
        }
      }

      // visibilitychange / beforeunload で確実に保存 & バックグラウンド省電力化
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          savePlaybackState();
          // スリープ・バックグラウンド移行時は描画ループを停止してCPU負荷を完全にカット
          if (visualizerAnimId) {
            cancelAnimationFrame(visualizerAnimId);
            visualizerAnimId = null;
          }
        } else {
          // フォアグラウンド復帰時はビジュアライザー描画を再開
          startVisualizer();
          // リアルスペアナモードでAudioContextがiOSの省電力等で中断されている場合は自動再開
          if (audioMode === 'real' && audioCtx && audioCtx.state === 'suspended' && !audio.paused) {
            audioCtx.resume().catch(() => {});
          }
        }
      });
      window.addEventListener('beforeunload', () => {
        savePlaybackState();
      });

      // ミニバーのボタンを通常の「再生」ボタンに戻す
      function restoreMinibarToNormal() {
        minibarActionArea.innerHTML = '';
        minibarActionArea.appendChild(minibarPlayBtn);
      }

      // アプリ起動時のレジュームチェック
      function checkResumeState() {
        const lastFileName = localStorage.getItem(STORAGE_KEY_FILE);
        const lastTime = parseFloat(localStorage.getItem(STORAGE_KEY_TIME) || '0');

        if (lastFileName) {
          const dummyTrack = {
            name: lastFileName,
            title: cleanTrackName(lastFileName),
            trackNo: parseTrackNumberFromFilename(lastFileName)
          };
          const title = formatTrackDisplayTitle(dummyTrack);

          // ミニバーに前回の曲名と秒数を表示
          minibarTitle.textContent = title;
          minibarSub.textContent = `前回 ${formatTime(lastTime)} まで再生`;

          playerTitle.textContent = title;
          playerFolder.textContent = `前回の曲 (${formatTime(lastTime)}〜)`;

          // 右端ボタンを <label> による [ 📂 続きをロード ] ボタンに置き換え（フォルダ & クラウドファイル両対応）
          minibarActionArea.innerHTML = `
            <div style="display:flex;gap:6px;align-items:center;">
              <label for="resume-picker-input" class="resume-label-btn" title="フォルダから続きをロード（本体内 / PC）">
                <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                <span>フォルダ</span>
              </label>
              <label for="files-picker-input" class="resume-label-btn" title="ファイルから続きをロード（Google Drive / OneDrive対応）">
                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                <span>ファイル</span>
              </label>
            </div>
          `;
        }
      }

      // レジューム選択時の処理
      resumePickerInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
          handleLoadedFiles(e.target.files, true);
        }
      });

      // ==========================================================================
      // MediaSession API (ロック画面・バックグラウンド操作対応)
      // ==========================================================================
      function setupMediaSession(track) {
        if (!('mediaSession' in navigator)) return;

        const title = formatTrackDisplayTitle(track);
        const artist = track.artist || 'MokuPlay オフライン';
        const album = track.parentPath || 'MokuPlay';

        const artworkList = [];
        if (currentArtworkUrl) {
          artworkList.push({ src: currentArtworkUrl, sizes: '512x512' });
        } else {
          // 木目調アートワークのプレースホルダーSVG Data URL
          const artworkSvg = `
            <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
              <rect width="512" height="512" fill="#caa06d"/>
              <circle cx="256" cy="256" r="220" fill="#24160a"/>
              <circle cx="256" cy="256" r="100" fill="#caa06d"/>
              <circle cx="256" cy="256" r="30" fill="#24160a"/>
            </svg>
          `;
          artworkList.push({ src: `data:image/svg+xml;utf8,${encodeURIComponent(artworkSvg)}`, sizes: '512x512', type: 'image/svg+xml' });
        }

        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: artist,
          album: album,
          artwork: artworkList
        });

        navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrevTrack());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNextTrack(false));

        try {
          navigator.mediaSession.setActionHandler('seekto', (details) => {
            if (details.seekTime && !isNaN(details.seekTime)) {
              audio.currentTime = details.seekTime;
            }
          });
        } catch (e) {}
      }

      // --- 起動時初期化 ---
      updateAudioModeUI();
      startVisualizer();
      checkResumeState();

    })();
  </script>
</body>
</html>
