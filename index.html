  <script>
    /* ==========================================================================
       MokuPlay - 単一ファイル・完全オフライン音楽プレイヤー
       ========================================================================== */
    (function() {
      'use strict';

      // --- 定数 & 設定 ---
      const STORAGE_KEY_FILE = 'mokuplay_last_file';
      const STORAGE_KEY_TIME = 'mokuplay_last_time';
      const STORAGE_KEY_FOLDER = 'mokuplay_last_folder';
      const STORAGE_KEY_SHUFFLE = 'mokuplay_shuffle';
      const STORAGE_KEY_REPEAT = 'mokuplay_repeat';
      const STORAGE_KEY_VOL = 'mokuplay_volume';
      const STORAGE_KEY_AUDIO_MODE = 'mokuplay_audio_mode'; // 'direct' または 'real'
      const SUPPORTED_EXTS = ['.mp3', '.m4a', '.flac', '.wav', '.ogg', '.aac', '.webm'];

      // iOS / iPadOS デバイスの判定
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      // iOSのバックグラウンド再生を最大化するためのAudioSession設定（対応環境のみ）
      if ('audioSession' in navigator) {
        try {
          navigator.audioSession.type = 'playback';
        } catch (_) {}
      }

      // --- DOM要素キャッシュ ---
      let audio = document.getElementById('audio-player');
      const tabListBtn = document.getElementById('tab-list-btn');
      const tabPlayerBtn = document.getElementById('tab-player-btn');
      const viewList = document.getElementById('view-list');
      const viewPlayer = document.getElementById('view-player');

      const btnHome = document.getElementById('btn-home');
      const homeLongPressBar = document.getElementById('home-long-press-bar');
      const btnUp = document.getElementById('btn-up');
      const breadcrumbsEl = document.getElementById('breadcrumbs');
      const emptyStateEl = document.getElementById('empty-state');
      const fileListEl = document.getElementById('file-list');

      const folderPickerInput = document.getElementById('folder-picker-input');
      const resumePickerInput = document.getElementById('resume-picker-input');
      const filesPickerInput = document.getElementById('files-picker-input');

      const minibar = document.getElementById('minibar');
      const minibarTextArea = document.getElementById('minibar-text-area');
      const minibarTitle = document.getElementById('minibar-title');
      const minibarSub = document.getElementById('minibar-sub');
      const minibarThumbImg = document.getElementById('minibar-thumb-img');
      const minibarThumbSvg = document.getElementById('minibar-thumb-svg');
      const minibarActionArea = document.getElementById('minibar-action-area');
      const minibarPlayBtn = document.getElementById('minibar-play-btn');
      const minibarPlayIcon = document.getElementById('minibar-play-icon');

      const playerTitle = document.getElementById('player-title');
      const playerFolder = document.getElementById('player-folder');
      const artworkArea = document.getElementById('artwork-area');
      const artworkImg = document.getElementById('artwork-img');
      const vinylDisc = document.getElementById('vinyl-disc');
      const touchPrev = document.getElementById('touch-prev');
      const touchNext = document.getElementById('touch-next');

      const seekSlider = document.getElementById('seek-slider');
      const currentTimeEl = document.getElementById('current-time');
      const totalTimeEl = document.getElementById('total-time');

      const btnShuffle = document.getElementById('btn-shuffle');
      const btnPrev = document.getElementById('btn-prev');
      const btnPlayPause = document.getElementById('btn-play-pause');
      const mainPlayIcon = document.getElementById('main-play-icon');
      const btnStop = document.getElementById('btn-stop');
      const btnNext = document.getElementById('btn-next');
      const btnRepeat = document.getElementById('btn-repeat');
      const volumeSlider = document.getElementById('volume-slider');

      const toastEl = document.getElementById('toast-msg');
      const visualizerCanvas = document.getElementById('visualizer-canvas');
      const canvasCtx = visualizerCanvas.getContext('2d');
      const btnAudioMode = document.getElementById('btn-audio-mode');
      const audioModeIcon = document.getElementById('audio-mode-icon');
      const audioModeText = document.getElementById('audio-mode-text');



      /* 【有料版向け機能】
      const btnSaveApp = document.getElementById('btn-save-app');
      const saveModal = document.getElementById('save-modal');
      const btnSaveModalClose = document.getElementById('btn-save-modal-close');
      */

      // --- アプリ状態 ---
      // 仮想ファイルシステム: Map<relativePath, { name, path, isDir, fileObj, parentPath }>
      let fileTree = new Map();
      let currentPath = ''; // 空文字はルート
      let playlist = [];    // 現在の再生キュー (ファイルオブジェクト配列)
      let currentTrackIndex = -1;
      let isShuffle = localStorage.getItem(STORAGE_KEY_SHUFFLE) === 'true';
      let isRepeat = localStorage.getItem(STORAGE_KEY_REPEAT) !== 'false'; // 初期状態は有効 (true)
      let currentArtworkUrl = null; // メモリ管理用URLキャッシュ

      // 再生モード: iOSはデフォルトで'direct'（スリープ時も絶対音が止まらない）、PC/Android等は'real'（リアルスペアナ）
      let audioMode = localStorage.getItem(STORAGE_KEY_AUDIO_MODE) || (isIOS ? 'direct' : 'real');

      // Web Audio API
      let audioCtx = null;
      let analyser = null;
      let sourceNode = null;
      let visualizerRunning = false;
      let visualizerAnimId = null;

      // シークバー操作中フラグ
      let isSeeking = false;

      // ==========================================================================
      // ユーティリティ
      // ==========================================================================
      function showToast(msg, duration = 3000) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => {
          toastEl.classList.remove('show');
        }, duration);
      }

      function formatTime(seconds) {
        if (!seconds || isNaN(seconds) || seconds < 0) return '00:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      }

      function isAudioFile(name) {
        const lower = name.toLowerCase();
        return SUPPORTED_EXTS.some(ext => lower.endsWith(ext));
      }

      function cleanTrackName(filename) {
        // 拡張子を除去
        return filename.replace(/\.[^/.]+$/, '');
      }

      // テキストデコード（BOM / UTF-16 / UTF-8 / Latin1 自動判別）
      function decodeText(bytes, encoding) {
        if (!bytes || bytes.length === 0) return '';
        try {
          if (encoding === 1) { // UTF-16 with BOM
            return new TextDecoder('utf-16').decode(bytes).replace(/\0+$/, '').trim();
          } else if (encoding === 2) { // UTF-16BE
            return new TextDecoder('utf-16be').decode(bytes).replace(/\0+$/, '').trim();
          } else if (encoding === 3) { // UTF-8
            return new TextDecoder('utf-8').decode(bytes).replace(/\0+$/, '').trim();
          } else { // 0: ISO-8859-1 or try UTF-8 fallback
            try {
              return new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/\0+$/, '').trim();
            } catch {
              return new TextDecoder('iso-8859-1').decode(bytes).replace(/\0+$/, '').trim();
            }
          }
        } catch {
          return '';
        }
      }

      // ==========================================================================
      // トラック番号・曲名ユーティリティ & ソート比較関数
      // ==========================================================================

      // トラック番号解析（"001" -> 1, "01/12" -> 1 等、左側のゼロを除去して正の整数値にする）
      function parseTrackNumber(val) {
        if (val === null || val === undefined) return null;
        if (typeof val === 'number') {
          return (!isNaN(val) && val > 0) ? Math.floor(val) : null;
        }
        const str = String(val).trim();
        if (!str) return null;
        const firstPart = str.split('/')[0].trim();
        const match = firstPart.match(/^0*(\d+)/);
        if (match && match[1]) {
          const n = parseInt(match[1], 10);
          return (n > 0 && n < 10000) ? n : null;
        }
        return null;
      }

      // ファイル名からトラック番号を抽出（例: "001. Song.mp3", "01 - Song.flac", "[03] Song.m4a", "001.mp3"）
      function parseTrackNumberFromFilename(filename) {
        if (!filename) return null;
        const clean = cleanTrackName(filename);
        // 先頭の [01], (01), 001., 01 -, 01_ などのパターン
        const match = clean.match(/^[\(\[]?0*(\d{1,4})[\)\]\.\s_\-]+/);
        if (match && match[1]) {
          const n = parseInt(match[1], 10);
          if (n > 0 && n < 10000) return n;
        }
        // "Track 01" 形式
        const trackWordMatch = clean.match(/^track[\s_\-]*0*(\d{1,4})/i);
        if (trackWordMatch && trackWordMatch[1]) {
          const n = parseInt(trackWordMatch[1], 10);
          if (n > 0 && n < 10000) return n;
        }
        // ファイル名自体が数値のみ（例: "001.mp3", "03.flac"）
        const pureNumMatch = clean.match(/^0*(\d+)$/);
        if (pureNumMatch && pureNumMatch[1]) {
          const n = parseInt(pureNumMatch[1], 10);
          if (n > 0 && n < 10000) return n;
        }
        return null;
      }

      // トラック番号を冠した表示用タイトルの生成（ゼロ埋め除去）
      function formatTrackDisplayTitle(track) {
        if (!track) return '';
        let title = track.title || cleanTrackName(track.name);
        if (track.trackNo != null && !isNaN(track.trackNo)) {
          const num = track.trackNo;
          // タイトル文字列の先頭にすでにトラック番号（0埋め含む）＋記号がある場合は重複を防ぐため除去
          const prefixRegex = new RegExp(`^[\\(\\[]?0*${num}[\\)\\]\\.\\s_\\-]*\\s*`, 'i');
          if (prefixRegex.test(title)) {
            const stripped = title.replace(prefixRegex, '').trim();
            if (!stripped) {
              return String(num);
            }
            title = stripped;
          }
          return `${num}. ${title}`;
        }
        return title;
      }

      // 曲のソート比較関数
      // 優先度 1: トラックNo昇順（左側のゼロを除去した整数値）
      // 優先度 2: ファイル名昇順（自然順ソート）
      function compareTracks(a, b) {
        const aHas = (a.trackNo != null && !isNaN(a.trackNo));
        const bHas = (b.trackNo != null && !isNaN(b.trackNo));

        if (aHas && bHas) {
          if (a.trackNo !== b.trackNo) {
            return a.trackNo - b.trackNo;
          }
        } else if (aHas && !bHas) {
          return -1; // a を優先
        } else if (!aHas && bHas) {
          return 1;  // b を優先
        }

        // 優先度 2: ファイル名昇順
        const nameA = a.name || '';
        const nameB = b.name || '';
        return nameA.localeCompare(nameB, undefined, { numeric: true, sensitivity: 'base' });
      }

      // ==========================================================================
      // 埋め込みテキストメタデータ（トラック名・アーティスト名・トラックNo）解析パーサー
      // ==========================================================================
      async function extractTrackMetadata(file) {
        if (!file) return { title: null, artist: null, trackNo: null };
        try {
          const lowerName = file.name.toLowerCase();
          let res = { title: null, artist: null, trackNo: null };
          if (lowerName.endsWith('.mp3')) {
            res = await parseId3v2TextTags(file);
          } else if (lowerName.endsWith('.flac')) {
            res = await parseFlacTextTags(file);
          } else if (lowerName.endsWith('.m4a') || lowerName.endsWith('.mp4') || lowerName.endsWith('.aac')) {
            res = await parseMp4TextTags(file);
          } else {
            res = await parseId3v2TextTags(file);
            if (!res.title && !res.artist && !res.trackNo) res = await parseMp4TextTags(file);
          }
          // タグからトラックNoが取得できなかった場合はファイル名からフォールバック
          if (res.trackNo == null) {
            res.trackNo = parseTrackNumberFromFilename(file.name);
          }
          return res;
        } catch (err) {
          console.warn('テキストタグ抽出エラー:', err);
          return { title: null, artist: null, trackNo: parseTrackNumberFromFilename(file.name) };
        }
      }

      // MP3 (ID3v2.2 / ID3v2.3 / ID3v2.4) の TIT2/TT2, TPE1/TP1, TRCK/TRK 解析
      async function parseId3v2TextTags(file) {
        const headerBuf = await file.slice(0, 10).arrayBuffer();
        if (headerBuf.byteLength < 10) return { title: null, artist: null, trackNo: null };
        const h = new Uint8Array(headerBuf);
        if (h[0] !== 0x49 || h[1] !== 0x44 || h[2] !== 0x33) return { title: null, artist: null, trackNo: null };

        const version = h[3];
        const tagSize = ((h[6] & 0x7f) << 21) | ((h[7] & 0x7f) << 14) | ((h[8] & 0x7f) << 7) | (h[9] & 0x7f);
        const readSize = Math.min(tagSize + 10, 256 * 1024, file.size);
        const tagBuf = await file.slice(0, readSize).arrayBuffer();
        const data = new Uint8Array(tagBuf);
        const limit = Math.min(data.length, tagSize + 10);

        let offset = 10;
        let title = null;
        let artist = null;
        let trackNo = null;

        if (version === 2) { // ID3v2.2
          while (offset + 6 < limit && (!title || !artist || !trackNo)) {
            const frameId = String.fromCharCode(data[offset], data[offset + 1], data[offset + 2]);
            const frameSize = (data[offset + 3] << 16) | (data[offset + 4] << 8) | data[offset + 5];
            offset += 6;
            if (frameSize <= 0 || offset + frameSize > limit) break;

            if (frameId === 'TT2' && !title) {
              title = decodeText(data.subarray(offset + 1, offset + frameSize), data[offset]);
            } else if (frameId === 'TP1' && !artist) {
              artist = decodeText(data.subarray(offset + 1, offset + frameSize), data[offset]);
            } else if (frameId === 'TRK' && !trackNo) {
              const trkStr = decodeText(data.subarray(offset + 1, offset + frameSize), data[offset]);
              trackNo = parseTrackNumber(trkStr);
            }
            offset += frameSize;
          }
        } else if (version === 3 || version === 4) { // ID3v2.3 / ID3v2.4
          while (offset + 10 < limit && (!title || !artist || !trackNo)) {
            const frameId = String.fromCharCode(data[offset], data[offset + 1], data[offset + 2], data[offset + 3]);
            let frameSize;
            if (version === 4) {
              frameSize = ((data[offset + 4] & 0x7f) << 21) | ((data[offset + 5] & 0x7f) << 14) | ((data[offset + 6] & 0x7f) << 7) | (data[offset + 7] & 0x7f);
            } else {
              frameSize = (data[offset + 4] << 24) | (data[offset + 5] << 16) | (data[offset + 6] << 8) | data[offset + 7];
            }
            offset += 10;
            if (frameSize <= 0 || offset + frameSize > limit) break;

            if (frameId === 'TIT2' && !title) {
              title = decodeText(data.subarray(offset + 1, offset + frameSize), data[offset]);
            } else if (frameId === 'TPE1' && !artist) {
              artist = decodeText(data.subarray(offset + 1, offset + frameSize), data[offset]);
            } else if (frameId === 'TRCK' && !trackNo) {
              const trkStr = decodeText(data.subarray(offset + 1, offset + frameSize), data[offset]);
              trackNo = parseTrackNumber(trkStr);
            }
            offset += frameSize;
          }
        }
        return { title, artist, trackNo };
      }

      // FLAC VORBIS_COMMENT (Block Type 4) 解析
      async function parseFlacTextTags(file) {
        const readSize = Math.min(256 * 1024, file.size);
        const buf = await file.slice(0, readSize).arrayBuffer();
        if (buf.byteLength < 4) return { title: null, artist: null, trackNo: null };
        const data = new Uint8Array(buf);
        if (data[0] !== 0x66 || data[1] !== 0x4C || data[2] !== 0x61 || data[3] !== 0x43) return { title: null, artist: null, trackNo: null };

        let offset = 4;
        let isLast = false;
        let title = null;
        let artist = null;
        let trackNo = null;

        while (offset + 4 < data.length && !isLast && (!title || !artist || !trackNo)) {
          const headerByte = data[offset];
          isLast = (headerByte & 0x80) !== 0;
          const blockType = headerByte & 0x7F;
          const blockSize = (data[offset + 1] << 16) | (data[offset + 2] << 8) | data[offset + 3];
          offset += 4;

          if (blockType === 4) { // METADATA_BLOCK_VORBIS_COMMENT
            let blockData = data;
            let blockOffset = offset;
            if (offset + blockSize > data.length) {
              const fullBlockBuf = await file.slice(offset, offset + blockSize).arrayBuffer();
              blockData = new Uint8Array(fullBlockBuf);
              blockOffset = 0;
            }
            const view = new DataView(blockData.buffer, blockData.byteOffset, blockData.byteLength);
            let pos = blockOffset;
            const vendorLen = view.getUint32(pos, true);
            pos += 4 + vendorLen;
            const commentCount = view.getUint32(pos, true);
            pos += 4;

            for (let i = 0; i < commentCount && pos < blockOffset + blockSize; i++) {
              const len = view.getUint32(pos, true);
              pos += 4;
              if (pos + len <= blockData.length) {
                const commentStr = new TextDecoder('utf-8').decode(blockData.subarray(pos, pos + len));
                const eqIdx = commentStr.indexOf('=');
                if (eqIdx !== -1) {
                  const key = commentStr.substring(0, eqIdx).toUpperCase();
                  const val = commentStr.substring(eqIdx + 1).trim();
                  if (key === 'TITLE' && !title) title = val;
                  if (key === 'ARTIST' && !artist) artist = val;
                  if ((key === 'TRACKNUMBER' || key === 'TRACK') && !trackNo) {
                    trackNo = parseTrackNumber(val);
                  }
                }
              }
              pos += len;
            }
          }
          offset += blockSize;
        }
        return { title, artist, trackNo };
      }

      // MP4 / M4A ©nam, ©ART, trkn 解析
      async function parseMp4TextTags(file) {
        const readSize = Math.min(512 * 1024, file.size);
        let buf = await file.slice(0, readSize).arrayBuffer();
        let res = scanMp4ForText(new Uint8Array(buf));
        if (res.title || res.artist || res.trackNo) return res;

        if (file.size > readSize) {
          const tailSize = Math.min(512 * 1024, file.size);
          const tailBuf = await file.slice(file.size - tailSize, file.size).arrayBuffer();
          res = scanMp4ForText(new Uint8Array(tailBuf));
        }
        return res;
      }

      function scanMp4ForText(data) {
        const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
        const len = data.length;
        let title = null;
        let artist = null;
        let trackNo = null;

        for (let i = 0; i < len - 8 && (!title || !artist || !trackNo); i++) {
          const isTitle = (data[i] === 0xA9 && data[i + 1] === 0x6E && data[i + 2] === 0x61 && data[i + 3] === 0x6D);
          const isArtist = (data[i] === 0xA9 && data[i + 1] === 0x41 && data[i + 2] === 0x52 && data[i + 3] === 0x54);
          const isTrkn = (data[i] === 0x74 && data[i + 1] === 0x72 && data[i + 2] === 0x6B && data[i + 3] === 0x6E);

          if (isTitle || isArtist || isTrkn) {
            let atomSize = (i >= 4) ? view.getUint32(i - 4, false) : 0;
            if (atomSize <= 8 || atomSize > 64 * 1024) atomSize = 4096;
            const atomEnd = Math.min(len, i + atomSize);

            for (let j = i + 4; j < atomEnd - 16; j++) {
              if (data[j] === 0x64 && data[j + 1] === 0x61 && data[j + 2] === 0x74 && data[j + 3] === 0x61) {
                const dataSize = (j >= 4) ? view.getUint32(j - 4, false) : 0;
                const payloadStart = j + 12;
                const payloadEnd = (dataSize > 16 && j - 4 + dataSize <= len) ? (j - 4 + dataSize) : atomEnd;
                if (payloadStart < payloadEnd) {
                  if (isTrkn && !trackNo) {
                    if (payloadEnd - payloadStart >= 4) {
                      const trkVal = view.getUint16(payloadStart + 2, false);
                      if (trkVal > 0 && trkVal < 10000) {
                        trackNo = trkVal;
                      }
                    }
                    if (!trackNo) {
                      const str = new TextDecoder('utf-8').decode(data.subarray(payloadStart, payloadEnd)).trim();
                      trackNo = parseTrackNumber(str);
                    }
                  } else {
                    const str = new TextDecoder('utf-8').decode(data.subarray(payloadStart, payloadEnd)).replace(/\0+$/, '').trim();
                    if (isTitle && !title) title = str;
                    if (isArtist && !artist) artist = str;
                  }
                }
                break;
              }
            }
          }
        }
        return { title, artist, trackNo };
      }

      // ==========================================================================
      // 埋め込みアートワーク（ジャケット画像）解析パーサー (完全オフライン・バニラJS)
      // MP3(ID3v2) / FLAC / MP4-M4A のバイナリからアートワーク画像を抽出
      // ==========================================================================
      function detectMimeType(bytes, fallbackMime) {
        if (!bytes || bytes.length < 4) return fallbackMime || 'image/jpeg';
        // JPEG: FF D8 FF
        if (bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF) return 'image/jpeg';
        // PNG: 89 50 4E 47
        if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) return 'image/png';
        // GIF: 47 49 46
        if (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46) return 'image/gif';
        // WEBP: RIFF...WEBP
        if (bytes.length >= 12 && bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46 &&
            bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50) {
          return 'image/webp';
        }
        return fallbackMime || 'image/jpeg';
      }

      function createBlobUrl(bytes, suggestedMime) {
        if (!bytes || bytes.length === 0) return null;
        const mime = detectMimeType(bytes, suggestedMime);
        const blob = new Blob([bytes], { type: mime });
        return URL.createObjectURL(blob);
      }

      async function extractEmbeddedArtwork(file) {
        if (!file) return null;
        try {
          const lowerName = file.name.toLowerCase();
          if (lowerName.endsWith('.mp3')) {
            return await parseId3v2Artwork(file);
          } else if (lowerName.endsWith('.flac')) {
            return await parseFlacArtwork(file);
          } else if (lowerName.endsWith('.m4a') || lowerName.endsWith('.mp4') || lowerName.endsWith('.aac')) {
            return await parseMp4Artwork(file);
          }
          let res = await parseId3v2Artwork(file);
          if (!res) res = await parseMp4Artwork(file);
          return res;
        } catch (err) {
          console.warn('埋め込みアートワーク抽出エラー:', err);
          return null;
        }
      }

      // MP3 (ID3v2.2 / ID3v2.3 / ID3v2.4) APIC/PIC フレーム解析
      async function parseId3v2Artwork(file) {
        const headerBuf = await file.slice(0, 10).arrayBuffer();
        if (headerBuf.byteLength < 10) return null;
        const h = new Uint8Array(headerBuf);

        // "ID3"
        if (h[0] !== 0x49 || h[1] !== 0x44 || h[2] !== 0x33) return null;

        const version = h[3];
        const tagSize = ((h[6] & 0x7f) << 21) | ((h[7] & 0x7f) << 14) | ((h[8] & 0x7f) << 7) | (h[9] & 0x7f);

        // タグ全体を読み込み (最大12MB)
        const readSize = Math.min(tagSize + 10, 12 * 1024 * 1024, file.size);
        const tagBuf = await file.slice(0, readSize).arrayBuffer();
        const data = new Uint8Array(tagBuf);
        const limit = Math.min(data.length, tagSize + 10);
        let offset = 10;

        if (version === 2) {
          // ID3v2.2: 3バイトID, 3バイトサイズ
          while (offset + 6 < limit) {
            const frameId = String.fromCharCode(data[offset], data[offset + 1], data[offset + 2]);
            const frameSize = (data[offset + 3] << 16) | (data[offset + 4] << 8) | data[offset + 5];
            offset += 6;
            if (frameSize <= 0 || offset + frameSize > limit) break;

            if (frameId === 'PIC') {
              const enc = data[offset];
              const format = String.fromCharCode(data[offset + 1], data[offset + 2], data[offset + 3]).toLowerCase();
              const mime = (format === 'png') ? 'image/png' : 'image/jpeg';
              let pos = offset + 5;
              if (enc === 1) { // UTF-16
                while (pos + 1 < offset + frameSize && !(data[pos] === 0 && data[pos + 1] === 0)) pos += 2;
                pos += 2;
              } else {
                while (pos < offset + frameSize && data[pos] !== 0) pos++;
                pos++;
              }
              if (pos < offset + frameSize) {
                return createBlobUrl(data.subarray(pos, offset + frameSize), mime);
              }
            }
            offset += frameSize;
          }
        } else if (version === 3 || version === 4) {
          // ID3v2.3 / ID3v2.4: 4バイトID, 4バイトサイズ, 2バイトフラグ
          while (offset + 10 < limit) {
            const frameId = String.fromCharCode(data[offset], data[offset + 1], data[offset + 2], data[offset + 3]);
            let frameSize;
            if (version === 4) {
              frameSize = ((data[offset + 4] & 0x7f) << 21) | ((data[offset + 5] & 0x7f) << 14) | ((data[offset + 6] & 0x7f) << 7) | (data[offset + 7] & 0x7f);
            } else {
              frameSize = (data[offset + 4] << 24) | (data[offset + 5] << 16) | (data[offset + 6] << 8) | data[offset + 7];
            }
            offset += 10;
            if (frameSize <= 0 || offset + frameSize > limit) break;

            if (frameId === 'APIC') {
              const enc = data[offset];
              let pos = offset + 1;

              // MIME type 文字列 (null終端)
              let mime = '';
              while (pos < offset + frameSize && data[pos] !== 0) {
                mime += String.fromCharCode(data[pos]);
                pos++;
              }
              pos++; // nullをスキップ

              // picture type (1 byte)
              pos++;

              // description (null終端)
              if (enc === 1 || enc === 2) { // UTF-16
                while (pos + 1 < offset + frameSize && !(data[pos] === 0 && data[pos + 1] === 0)) {
                  pos += 2;
                }
                pos += 2;
              } else {
                while (pos < offset + frameSize && data[pos] !== 0) {
                  pos++;
                }
                pos++;
              }

              if (pos < offset + frameSize) {
                return createBlobUrl(data.subarray(pos, offset + frameSize), mime);
              }
            }
            offset += frameSize;
          }
        }
        return null;
      }

      // FLAC METADATA_BLOCK_PICTURE (Block Type 6) 解析
      async function parseFlacArtwork(file) {
        const readSize = Math.min(2 * 1024 * 1024, file.size);
        const buf = await file.slice(0, readSize).arrayBuffer();
        if (buf.byteLength < 4) return null;
        const data = new Uint8Array(buf);

        // "fLaC"
        if (data[0] !== 0x66 || data[1] !== 0x4C || data[2] !== 0x61 || data[3] !== 0x43) return null;

        let offset = 4;
        let isLast = false;

        while (offset + 4 < data.length && !isLast) {
          const headerByte = data[offset];
          isLast = (headerByte & 0x80) !== 0;
          const blockType = headerByte & 0x7F;
          const blockSize = (data[offset + 1] << 16) | (data[offset + 2] << 8) | data[offset + 3];
          offset += 4;

          if (blockType === 6) { // METADATA_BLOCK_PICTURE
            if (offset + blockSize > data.length) {
              const fullBlockBuf = await file.slice(offset - 4, offset + blockSize).arrayBuffer();
              return parseFlacPictureBlock(new Uint8Array(fullBlockBuf), 4);
            }
            return parseFlacPictureBlock(data, offset);
          }
          offset += blockSize;
        }
        return null;
      }

      function parseFlacPictureBlock(data, offset) {
        let pos = offset;
        const view = new DataView(data.buffer, data.byteOffset, data.byteLength);

        // picture type (4 bytes)
        pos += 4;
        // MIME length
        const mimeLen = view.getUint32(pos, false);
        pos += 4;
        let mime = '';
        for (let i = 0; i < mimeLen; i++) mime += String.fromCharCode(data[pos + i]);
        pos += mimeLen;

        // Description length
        const descLen = view.getUint32(pos, false);
        pos += 4 + descLen;

        // width(4), height(4), depth(4), colors(4)
        pos += 16;

        // Data length
        const dataLen = view.getUint32(pos, false);
        pos += 4;

        if (pos + dataLen <= data.length) {
          return createBlobUrl(data.subarray(pos, pos + dataLen), mime);
        }
        return null;
      }

      // MP4 / M4A (covr アトム内の data) 解析
      async function parseMp4Artwork(file) {
        const readSize = Math.min(4 * 1024 * 1024, file.size);
        const buf = await file.slice(0, readSize).arrayBuffer();
        let result = scanMp4ForCovr(new Uint8Array(buf));
        if (result) return result;

        if (file.size > readSize) {
          const tailSize = Math.min(3 * 1024 * 1024, file.size);
          const tailBuf = await file.slice(file.size - tailSize, file.size).arrayBuffer();
          result = scanMp4ForCovr(new Uint8Array(tailBuf));
          if (result) return result;
        }
        return null;
      }

      function scanMp4ForCovr(data) {
        const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
        const len = data.length;

        for (let i = 0; i < len - 8; i++) {
          if (data[i] === 0x63 && data[i + 1] === 0x6F && data[i + 2] === 0x76 && data[i + 3] === 0x72) {
            // 'covr'
            let covrSize = (i >= 4) ? view.getUint32(i - 4, false) : 0;
            if (covrSize <= 8 || covrSize > 10 * 1024 * 1024) covrSize = 2 * 1024 * 1024;

            const covrEnd = Math.min(len, i + covrSize);
            for (let j = i + 4; j < covrEnd - 16; j++) {
              if (data[j] === 0x64 && data[j + 1] === 0x61 && data[j + 2] === 0x74 && data[j + 3] === 0x61) {
                // 'data'
                const dataSize = (j >= 4) ? view.getUint32(j - 4, false) : 0;
                const typeFlag = view.getUint32(j + 4, false) & 0xFF;
                let mime = 'image/jpeg';
                if (typeFlag === 14) mime = 'image/png';

                const imgStart = j + 12; // 4('data') + 4(flags) + 4(locale)
                const imgEnd = (dataSize > 16 && j - 4 + dataSize <= len) ? (j - 4 + dataSize) : covrEnd;

                if (imgStart < imgEnd) {
                  return createBlobUrl(data.subarray(imgStart, imgEnd), mime);
                }
              }
            }
          }
        }
        return null;
      }

      // UIにアートワーク画像を適用
      async function updateArtworkForTrack(file) {
        if (currentArtworkUrl) {
          URL.revokeObjectURL(currentArtworkUrl);
          currentArtworkUrl = null;
        }

        const url = await extractEmbeddedArtwork(file);
        currentArtworkUrl = url;

        if (url) {
          artworkImg.src = url;
          artworkImg.style.display = 'block';
          vinylDisc.style.display = 'none';

          minibarThumbImg.src = url;
          minibarThumbImg.style.display = 'block';
          minibarThumbSvg.style.display = 'none';
        } else {
          artworkImg.removeAttribute('src');
          artworkImg.style.display = 'none';
          vinylDisc.style.display = 'flex';

          minibarThumbImg.removeAttribute('src');
          minibarThumbImg.style.display = 'none';
          minibarThumbSvg.style.display = 'block';
        }
      }

      // ==========================================================================
      // タブ切り替え制御 (選曲画面 / 再生中画面)
      // ==========================================================================
      function switchTab(target) {
        if (target === 'list') {
          tabListBtn.classList.add('active');
          tabPlayerBtn.classList.remove('active');
          viewList.classList.add('active');
          viewPlayer.classList.remove('active');
          document.body.classList.remove('is-view-player');
          document.body.classList.add('is-view-list');
        } else {
          tabPlayerBtn.classList.add('active');
          tabListBtn.classList.remove('active');
          viewPlayer.classList.add('active');
          viewList.classList.remove('active');
          document.body.classList.remove('is-view-list');
          document.body.classList.add('is-view-player');
        }
      }

      tabListBtn.addEventListener('click', () => switchTab('list'));
      tabPlayerBtn.addEventListener('click', () => switchTab('player'));
      // ミニバーのテキスト領域タップでプレイヤー画面へ切り替え
      minibarTextArea.addEventListener('click', () => switchTab('player'));

      // ==========================================================================
      // Web Audio API & スペアナ (スペクトラムアナライザー) & 再生モード制御
      // ==========================================================================
      function updateAudioModeUI() {
        if (!btnAudioMode) return;
        if (audioMode === 'direct') {
          audioModeIcon.textContent = '🎧';
          audioModeText.textContent = 'スリープ対応';
          btnAudioMode.classList.remove('active');
          btnAudioMode.title = 'ダイレクト再生モード（画面スリープ・別アプリ時も音が鳴り続けます）。タップでリアルスペアナへ';
        } else {
          audioModeIcon.textContent = '📊';
          audioModeText.textContent = 'リアルスペアナ';
          btnAudioMode.classList.add('active');
          btnAudioMode.title = 'リアルスペアナモード（Web Audio API周波数解析）。タップでスリープ対応へ';
        }
      }

      function recreateAudioElement() {
        const oldAudio = audio;
        const wasPaused = oldAudio.paused;
        const curTime = oldAudio.currentTime;
        const curSrc = oldAudio.src;
        const curVol = oldAudio.volume;

        // Web Audio リソースを安全に切断・解放
        if (sourceNode) {
          try { sourceNode.disconnect(); } catch (_) {}
          sourceNode = null;
        }
        if (analyser) {
          try { analyser.disconnect(); } catch (_) {}
          analyser = null;
        }
        if (audioCtx) {
          try {
            audioCtx.close();
          } catch (_) {}
          audioCtx = null;
        }

        try {
          oldAudio.pause();
          oldAudio.removeAttribute('src');
          oldAudio.load();
        } catch (_) {}

        // 新しいAudio要素を作成（Web Audio非接続のネイティブ直接出力ルートを復元）
        const newAudio = document.createElement('audio');
        newAudio.id = 'audio-player';
        newAudio.preload = 'metadata';
        newAudio.volume = curVol;

        if (oldAudio.parentNode) {
          oldAudio.parentNode.replaceChild(newAudio, oldAudio);
        }
        audio = newAudio;
        attachAudioEventListeners(audio);

        if (curSrc) {
          audio.src = curSrc;
          audio.currentTime = curTime;
          if (!wasPaused) {
            audio.play().catch(e => console.warn('再生成後の自動再生:', e));
          }
        }
      }

      function toggleAudioMode() {
        if (audioMode === 'direct') {
          audioMode = 'real';
          localStorage.setItem(STORAGE_KEY_AUDIO_MODE, 'real');
          updateAudioModeUI();
          initAudioContext();
          showToast('📊 リアルスペアナモードに切り替えました');
        } else {
          audioMode = 'direct';
          localStorage.setItem(STORAGE_KEY_AUDIO_MODE, 'direct');
          updateAudioModeUI();
          recreateAudioElement();
          showToast('🎧 スリープ対応ダイレクト再生に切り替えました');
        }
      }

      if (btnAudioMode) {
        btnAudioMode.addEventListener('click', toggleAudioMode);
      }

      function initAudioContext() {
        // ダイレクト再生モードの場合はWeb Audio APIを経由させない（iOSスリープ対策）
        if (audioMode === 'direct') {
          return;
        }

        if (audioCtx) {
          if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
          }
          return;
        }

        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64; // モバイル向けに軽量かつ美しい解像度
          sourceNode = audioCtx.createMediaElementSource(audio);
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
          
          if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
          }
        } catch (e) {
          console.warn('AudioContext初期化エラー (環境の制限):', e);
        }
      }

      function startVisualizer() {
        if (visualizerAnimId) return; // 既にループ中

        const bufferLength = 32;
        const dataArray = new Uint8Array(bufferLength);

        function draw() {
          // バックグラウンド・スリープ時は描画ループを完全に停止しCPU負荷をゼロに保つ
          if (document.hidden) {
            visualizerAnimId = null;
            return;
          }

          visualizerAnimId = requestAnimationFrame(draw);

          // 描画解像度をコンテナの縦横実サイズに動的同期（高解像度・ワイド・縦拡大時のぼやけ防止）
          if (visualizerCanvas.clientWidth && visualizerCanvas.width !== visualizerCanvas.clientWidth) {
            visualizerCanvas.width = visualizerCanvas.clientWidth;
          }
          if (visualizerCanvas.clientHeight && visualizerCanvas.height !== visualizerCanvas.clientHeight) {
            visualizerCanvas.height = visualizerCanvas.clientHeight;
          }

          const width = visualizerCanvas.width;
          const height = visualizerCanvas.height;

          // 背景クリア（ダークウッド）
          canvasCtx.fillStyle = '#23160a';
          canvasCtx.fillRect(0, 0, width, height);

          if (audio.paused) {
            // アイドル時の落ち着いたフラットライン
            canvasCtx.fillStyle = '#6a4a28';
            canvasCtx.fillRect(0, height - 3, width, 2);
            return;
          }

          const barCount = Math.max(28, Math.min(64, Math.floor(width / 13)));
          const barWidth = (width / barCount) - 2;
          let x = 1;

          if (audioMode === 'real' && analyser) {
            // --- リアルスペアナ (Web Audio API FFT解析) ---
            analyser.getByteFrequencyData(dataArray);

            for (let i = 0; i < barCount; i++) {
              const dataIndex = Math.floor(i * (dataArray.length / barCount));
              const barHeight = ((dataArray[dataIndex] || 0) / 255) * (height - 4);

              const grad = canvasCtx.createLinearGradient(0, height, 0, height - barHeight);
              grad.addColorStop(0, '#caa06d');
              grad.addColorStop(0.5, '#ffaa2a');
              grad.addColorStop(1, '#ffe08a');

              canvasCtx.fillStyle = grad;
              canvasCtx.fillRect(x, height - barHeight - 2, barWidth, barHeight + 2);
              x += barWidth + 2;
            }
          } else {
            // --- ダイレクト再生モード用 疑似スペアナアニメーション ---
            // Web Audio API を一切使用しないため iOS スリープ・バックグラウンド再生が100%持続
            const now = performance.now() * 0.005;
            const curT = audio.currentTime;

            for (let i = 0; i < barCount; i++) {
              const normI = i / barCount;
              // 低域〜中域にピークのある音楽的エンベロープ
              const baseCurve = Math.pow(1 - normI * 0.65, 1.3);
              const beat1 = Math.sin(curT * 4.3 + normI * 6.28);
              const beat2 = Math.cos(curT * 2.1 - normI * 3.14);
              const wave = Math.sin(now * 1.6 + i * 0.45) * 0.3 + Math.sin(now * 3.1 - i * 0.25) * 0.2;
              const val = Math.max(0.08, (0.45 + 0.32 * beat1 + 0.22 * beat2 + wave) * baseCurve);
              const barHeight = Math.min(height - 4, Math.max(3, val * (height - 4)));

              const grad = canvasCtx.createLinearGradient(0, height, 0, height - barHeight);
              grad.addColorStop(0, '#caa06d');
              grad.addColorStop(0.5, '#ffaa2a');
              grad.addColorStop(1, '#ffe08a');

              canvasCtx.fillStyle = grad;
              canvasCtx.fillRect(x, height - barHeight - 2, barWidth, barHeight + 2);
              x += barWidth + 2;
            }
          }
        }

        visualizerAnimId = requestAnimationFrame(draw);
      }

      // ==========================================================================
      // ファイルシステム & フォルダ解析
      // ==========================================================================
      function parseFiles(files) {
        if (!files || files.length === 0) return;

        fileTree.clear();
        playlist = [];

        // ディレクトリを確実にツリーに登録するための再帰登録
        function ensureDirExists(dirPath) {
          if (!dirPath) return;
          if (fileTree.has(dirPath)) return;

          const parts = dirPath.split('/');
          const dirName = parts[parts.length - 1];
          const parentPath = parts.slice(0, -1).join('/');

          ensureDirExists(parentPath);

          fileTree.set(dirPath, {
            name: dirName,
            path: dirPath,
            isDir: true,
            parentPath: parentPath
          });
        }

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          // webkitRelativePath があればそれを使う、なければ name のみ
          const fullPath = file.webkitRelativePath || file.name;
          const parts = fullPath.split('/');

          if (parts.length > 1) {
            const dirPath = parts.slice(0, -1).join('/');
            ensureDirExists(dirPath);
          }

          if (isAudioFile(file.name)) {
            const parentPath = parts.length > 1 ? parts.slice(0, -1).join('/') : '';
            const initialTrackNo = parseTrackNumberFromFilename(file.name);
            const trackItem = {
              name: file.name,
              path: fullPath,
              isDir: false,
              fileObj: file,
              parentPath: parentPath,
              trackNo: initialTrackNo,
              title: cleanTrackName(file.name),
              artist: parentPath || 'ルート',
              tagParsed: false
            };
            fileTree.set(fullPath, trackItem);
            playlist.push(trackItem);
          }
        }

        if (playlist.length === 0) {
          showToast('音楽ファイルが見つかりませんでした');
          renderList();
          return;
        }

        // フォルダ別・優先順ソート（1: トラックNo昇順, 2: ファイル名昇順）
        sortPlaylist();

        // ルート階層または前回開いていたフォルダ階層を復帰
        const savedFolder = localStorage.getItem(STORAGE_KEY_FOLDER);
        if (savedFolder && (fileTree.has(savedFolder) || Array.from(fileTree.values()).some(it => it.parentPath === savedFolder))) {
          currentPath = savedFolder;
        } else {
          currentPath = '';
        }

        renderList();
        showToast(`${playlist.length}曲のファイルを読み込みました`);
      }

      // プレイリスト全体のソート（フォルダ順、フォルダ内は優先順位1: トラックNo昇順, 2: ファイル名昇順）
      function sortPlaylist() {
        const currentPlayingPath = (currentTrackIndex >= 0 && playlist[currentTrackIndex]) ? playlist[currentTrackIndex].path : null;
        playlist.sort((a, b) => {
          if (a.parentPath !== b.parentPath) {
            return (a.parentPath || '').localeCompare(b.parentPath || '', undefined, { numeric: true, sensitivity: 'base' });
          }
          return compareTracks(a, b);
        });
        if (currentPlayingPath) {
          currentTrackIndex = playlist.findIndex(t => t.path === currentPlayingPath);
        }
      }

      // フォルダ内楽曲のタグ（トラック名・アーティスト名・トラックNo）を順次非同期解析してDOM更新
      async function fetchTagsForFiles(filesToParse) {
        for (const track of filesToParse) {
          if (!track.tagParsed) {
            extractTrackMetadata(track.fileObj).then((meta) => {
              track.tagParsed = true;
              let trackNoUpdated = false;
              if (meta.title) track.title = meta.title;
              if (meta.artist) track.artist = meta.artist;
              if (meta.trackNo != null && meta.trackNo !== track.trackNo) {
                track.trackNo = meta.trackNo;
                trackNoUpdated = true;
              }

              // 一致するDOM要素があればテキストを即時更新
              const escapedPath = CSS.escape ? CSS.escape(track.path) : track.path;
              const li = fileListEl.querySelector(`li[data-track-path="${escapedPath}"]`);
              if (li) {
                const titleEl = li.querySelector('.file-title');
                const metaEl = li.querySelector('.file-meta');
                if (titleEl) titleEl.textContent = formatTrackDisplayTitle(track);
                if (metaEl) metaEl.textContent = track.artist;
              }

              // 再生中の曲であればプレイヤー情報も更新
              if (currentTrackIndex >= 0 && playlist[currentTrackIndex]?.path === track.path) {
                updateTrackInfoUI(track);
                setupMediaSession(track);
              }

              // トラック番号の更新によって曲順が変動した場合はソートとリストを再構成
              if (trackNoUpdated) {
                sortPlaylist();
                renderList();
              }
            }).catch(() => {
              track.tagParsed = true;
            });
          }
        }
      }

      // ファイルリストのレンダリング
      function renderList() {
        // 空状態チェック
        if (fileTree.size === 0) {
          emptyStateEl.style.display = 'block';
          fileListEl.style.display = 'none';
          btnUp.disabled = true;
          renderBreadcrumbs();
          return;
        }

        emptyStateEl.style.display = 'none';
        fileListEl.style.display = 'flex';
        fileListEl.innerHTML = '';

        // 親階層ボタンの状態
        btnUp.disabled = (currentPath === '');

        // パンくずの更新
        renderBreadcrumbs();

        // 現在の階層の子要素を取得
        const dirs = [];
        const files = [];

        fileTree.forEach((item) => {
          if (item.parentPath === currentPath) {
            if (item.isDir) dirs.push(item);
            else files.push(item);
          }
        });

        // ソート（フォルダは名前順、曲は優先度1: トラックNo昇順、優先度2: ファイル名昇順）
        dirs.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        files.sort(compareTracks);

        // フォルダ要素の描画
        dirs.forEach((dir) => {
          const li = document.createElement('li');
          li.className = 'file-item is-folder';
          li.innerHTML = `
            <div class="file-icon folder-icon">
              <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
            </div>
            <div class="file-info">
              <div class="file-title">${escapeHtml(dir.name)}</div>
              <div class="file-meta">フォルダ</div>
            </div>
            <svg style="width:20px;height:20px;fill:var(--wood-dark);" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          `;
          li.addEventListener('click', () => {
            currentPath = dir.path;
            localStorage.setItem(STORAGE_KEY_FOLDER, currentPath);
            renderList();
          });
          fileListEl.appendChild(li);
        });

        // 曲要素の描画（優先順位順、トラック番号付きトラック名・アーティスト名を表示）
        files.forEach((fileItem) => {
          const isCurrentlyPlaying = (currentTrackIndex >= 0 && playlist[currentTrackIndex]?.path === fileItem.path);
          const li = document.createElement('li');
          li.className = `file-item is-song ${isCurrentlyPlaying ? 'playing' : ''}`;
          li.setAttribute('data-track-path', fileItem.path);
          
          li.innerHTML = `
            <div class="file-icon song-icon">
              <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
            <div class="file-info">
              <div class="file-title">${escapeHtml(formatTrackDisplayTitle(fileItem))}</div>
              <div class="file-meta">${escapeHtml(fileItem.artist)}</div>
            </div>
            ${isCurrentlyPlaying ? `
              <div class="playing-indicator">
                <span></span><span></span><span></span>
              </div>
            ` : ''}
          `;

          li.addEventListener('click', () => {
            const idx = playlist.findIndex(p => p.path === fileItem.path);
            if (idx !== -1) {
              playTrackByIndex(idx);
              switchTab('player');
            }
          });

          fileListEl.appendChild(li);
        });

        // 現在表示されている曲のタグ（トラック名・アーティスト名・トラックNo）を非同期解析
        fetchTagsForFiles(files);
      }

      function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, function(m) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          }[m];
        });
      }

      // パンくずリスト更新
      function renderBreadcrumbs() {
        breadcrumbsEl.innerHTML = '';
        const rootSpan = document.createElement('span');
        rootSpan.className = 'crumb-item';
        rootSpan.textContent = '🏠 /';
        rootSpan.addEventListener('click', () => {
          currentPath = '';
          localStorage.setItem(STORAGE_KEY_FOLDER, '');
          renderList();
        });
        breadcrumbsEl.appendChild(rootSpan);

        if (!currentPath) return;

        const parts = currentPath.split('/');
        let accumPath = '';

        parts.forEach((part) => {
          accumPath = accumPath ? `${accumPath}/${part}` : part;
          const target = accumPath;

          const sep = document.createElement('span');
          sep.className = 'crumb-separator';
          sep.textContent = '/';
          breadcrumbsEl.appendChild(sep);

          const crumb = document.createElement('span');
          crumb.className = 'crumb-item';
          crumb.textContent = part;
          crumb.addEventListener('click', () => {
            currentPath = target;
            localStorage.setItem(STORAGE_KEY_FOLDER, target);
            renderList();
          });
          breadcrumbsEl.appendChild(crumb);
        });

        breadcrumbsEl.scrollLeft = breadcrumbsEl.scrollWidth;
      }

      // ==========================================================================
      // [ 🏠 トップ ] ボタン 長押し判定 (通常タップ: ルートへ / 長押し: フォルダ選択ダイアログ)
      // ==========================================================================
      let longPressTimer = null;
      let isLongPressed = false;
      const LONG_PRESS_DURATION = 900; // ms

      function triggerFolderDialog() {
        folderPickerInput.value = '';
        folderPickerInput.click();
      }

      function startLongPress(e) {
        isLongPressed = false;
        homeLongPressBar.style.transition = `width ${LONG_PRESS_DURATION}ms linear`;
        homeLongPressBar.style.width = '100%';

        longPressTimer = setTimeout(() => {
          isLongPressed = true;
          // バイブレーション (対応端末のみ)
          if (navigator.vibrate) navigator.vibrate(50);
          showToast('長押し検知：指を離すとフォルダ選択を開きます');
        }, LONG_PRESS_DURATION);
      }

      function endLongPress(e) {
        clearTimeout(longPressTimer);
        homeLongPressBar.style.transition = 'width 0.15s ease';
        homeLongPressBar.style.width = '0%';

        if (isLongPressed) {
          isLongPressed = false;
          // ユーザーの指離し操作（直接のユーザー操作イベント）の中でダイアログを起動
          // これによりiOS Safari等の非同期ポップアップブロックを完全に回避
          triggerFolderDialog();
        } else {
          // 通常タップ: ルートへジャンプ
          currentPath = '';
          localStorage.setItem(STORAGE_KEY_FOLDER, '');
          renderList();
        }
      }

      function cancelLongPress() {
        clearTimeout(longPressTimer);
        isLongPressed = false;
        homeLongPressBar.style.transition = 'width 0.15s ease';
        homeLongPressBar.style.width = '0%';
      }

      // ポインターイベント対応（iOS Safariのイベントロスト防止にPointerCaptureを活用）
      btnHome.addEventListener('pointerdown', (e) => {
        try { btnHome.setPointerCapture(e.pointerId); } catch (_) {}
        startLongPress(e);
      });
      btnHome.addEventListener('pointerup', (e) => {
        try { btnHome.releasePointerCapture(e.pointerId); } catch (_) {}
        endLongPress(e);
      });
      btnHome.addEventListener('pointercancel', (e) => {
        try { btnHome.releasePointerCapture(e.pointerId); } catch (_) {}
        cancelLongPress();
      });
      btnHome.addEventListener('contextmenu', (e) => e.preventDefault());

      // 1階層上へボタン
      btnUp.addEventListener('click', () => {
        if (!currentPath) return;
        const parts = currentPath.split('/');
        parts.pop();
        currentPath = parts.join('/');
        localStorage.setItem(STORAGE_KEY_FOLDER, currentPath);
        renderList();
      });

      // 読み込み完了時の共通処理（必要に応じてレジューム復帰を試行）
      function handleLoadedFiles(files, tryResume = false) {
        if (!files || files.length === 0) return;
        parseFiles(files);

        const targetFileName = localStorage.getItem(STORAGE_KEY_FILE);
        const resumeSec = parseFloat(localStorage.getItem(STORAGE_KEY_TIME) || '0');

        if (tryResume && targetFileName) {
          let matchedIndex = -1;
          for (let i = 0; i < playlist.length; i++) {
            if (playlist[i].name === targetFileName) {
              matchedIndex = i;
              break;
            }
          }

          if (matchedIndex !== -1) {
            playTrackByIndex(matchedIndex, resumeSec, false);
            const resumeTrack = playlist[matchedIndex];
            showToast(`「${formatTrackDisplayTitle(resumeTrack)}」を${formatTime(resumeSec)}で待機しました`);
          } else {
            showToast('前回の曲が見つかりませんでした');
            restoreMinibarToNormal();
            if (playlist.length > 0) {
              playTrackByIndex(0, 0, false);
            }
          }
        }
      }

      // フォルダインプットの変更検知
      folderPickerInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
          handleLoadedFiles(e.target.files, false);
        }
      });

      // ファイルインプット（複数曲選択）の変更検知 (Google Drive / OneDrive対応)
      filesPickerInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
          const hasResume = !!localStorage.getItem(STORAGE_KEY_FILE) && currentTrackIndex === -1;
          handleLoadedFiles(e.target.files, hasResume);
        }
      });

      // ==========================================================================
      // 再生制御ロジック
      // ==========================================================================
      function playTrackByIndex(index, seekSeconds = 0, autoplay = true) {
        if (index < 0 || index >= playlist.length) return;

        currentTrackIndex = index;
        const track = playlist[index];

        if (audioMode === 'real') {
          initAudioContext();
        }

        // 以前のObjectURLがあれば解放
        if (audio.src && audio.src.startsWith('blob:')) {
          URL.revokeObjectURL(audio.src);
        }

        const url = URL.createObjectURL(track.fileObj);
        audio.src = url;
        audio.currentTime = seekSeconds;

        updateTrackInfoUI(track);
        renderList();

        // フォルダ階層の記憶
        if (track.parentPath !== undefined) {
          localStorage.setItem(STORAGE_KEY_FOLDER, track.parentPath);
        }

        // タグが未取得なら即座にメタデータ（トラック名・アーティスト名・トラックNo）を抽出
        if (!track.tagParsed) {
          extractTrackMetadata(track.fileObj).then((meta) => {
            track.tagParsed = true;
            let trackNoUpdated = false;
            if (meta.title) track.title = meta.title;
            if (meta.artist) track.artist = meta.artist;
            if (meta.trackNo != null && meta.trackNo !== track.trackNo) {
              track.trackNo = meta.trackNo;
              trackNoUpdated = true;
            }
            if (currentTrackIndex === index) {
              updateTrackInfoUI(track);
              setupMediaSession(track);
            }
            if (trackNoUpdated) {
              sortPlaylist();
              renderList();
            }
          }).catch(() => {
            track.tagParsed = true;
          });
        }

        // 埋め込みアートワークを非同期抽出して表示更新
        updateArtworkForTrack(track.fileObj).then(() => {
          setupMediaSession(track);
        });

        if (autoplay) {
          audio.play().then(() => {
            updatePlayPauseUI(true);
          }).catch((err) => {
            console.warn('自動再生待機:', err);
            updatePlayPauseUI(false);
          });
        } else {
          updatePlayPauseUI(false);
        }

        savePlaybackState();
      }

      function updateTrackInfoUI(track) {
        const title = formatTrackDisplayTitle(track);
        const artist = track.artist || (track.parentPath || 'ルートフォルダ');

        playerTitle.textContent = title;
        playerFolder.textContent = artist;

        minibarTitle.textContent = title;
        minibarSub.textContent = artist;

        // ミニバーのアクションボタンを通常の再生ボタンに復帰
        restoreMinibarToNormal();
      }

      function updatePlayPauseUI(isPlaying) {
        // メインボタンアイコン切り替え
        if (isPlaying) {
          mainPlayIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          btnPlayPause.classList.add('is-playing');
          minibarPlayIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          vinylDisc.classList.add('spinning');
          vinylDisc.classList.remove('paused');
        } else {
          mainPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
          btnPlayPause.classList.remove('is-playing');
          minibarPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
          vinylDisc.classList.add('paused');
        }
      }

      function togglePlayPause() {
        if (audioMode === 'real') {
          initAudioContext();
        }

        if (currentTrackIndex === -1) {
          if (playlist.length > 0) {
            playTrackByIndex(0);
          } else {
            showToast('音楽フォルダを選択してください');
          }
          return;
        }

        if (audio.paused) {
          audio.play().then(() => {
            updatePlayPauseUI(true);
          }).catch(e => console.warn(e));
        } else {
          audio.pause();
          updatePlayPauseUI(false);
        }
      }

      function stopPlayback() {
        audio.pause();
        audio.currentTime = 0;
        updatePlayPauseUI(false);
        savePlaybackState();
      }

      function playNextTrack(isAutoNext = false) {
        if (playlist.length === 0) return;

        const currentTrack = playlist[currentTrackIndex];
        const currentFolder = currentTrack ? currentTrack.parentPath : '';
        const folderTracks = playlist.filter(t => t.parentPath === currentFolder);

        if (isAutoNext) {
          // 自動遷移（曲終了時）: 同フォルダ内の曲を対象とする
          if (folderTracks.length === 0) return;

          if (isShuffle) {
            if (folderTracks.length === 1) {
              if (isRepeat) playTrackByIndex(currentTrackIndex);
              else stopPlayback();
              return;
            }
            let nextT;
            do {
              nextT = folderTracks[Math.floor(Math.random() * folderTracks.length)];
            } while (nextT.path === currentTrack?.path);
            const targetIdx = playlist.findIndex(t => t.path === nextT.path);
            if (targetIdx !== -1) playTrackByIndex(targetIdx);
          } else {
            const curIdxInFolder = folderTracks.findIndex(t => t.path === currentTrack?.path);
            const nextIdxInFolder = curIdxInFolder + 1;

            if (nextIdxInFolder < folderTracks.length) {
              // 同フォルダ内の次の曲へ
              const nextT = folderTracks[nextIdxInFolder];
              const targetIdx = playlist.findIndex(t => t.path === nextT.path);
              if (targetIdx !== -1) playTrackByIndex(targetIdx);
            } else {
              // フォルダ最後の曲が終了
              if (isRepeat) {
                // リピート有効: 同フォルダの先頭曲へループ
                const firstT = folderTracks[0];
                const targetIdx = playlist.findIndex(t => t.path === firstT.path);
                if (targetIdx !== -1) playTrackByIndex(targetIdx);
              } else {
                // リピート無効: 停止
                stopPlayback();
                showToast('フォルダ内の全曲の再生が終了しました');
              }
            }
          }
        } else {
          // 手動操作（[次へ] ボタンまたはジャケット右タップ）
          let nextIndex;
          if (isShuffle && playlist.length > 1) {
            do {
              nextIndex = Math.floor(Math.random() * playlist.length);
            } while (nextIndex === currentTrackIndex);
          } else {
            nextIndex = (currentTrackIndex + 1) % playlist.length;
          }
          playTrackByIndex(nextIndex);
        }
      }

      function playPrevTrack() {
        if (playlist.length === 0) return;

        // 3秒以上再生していれば曲頭に戻る
        if (audio.currentTime > 3) {
          audio.currentTime = 0;
          return;
        }

        let prevIndex;
        if (isShuffle && playlist.length > 1) {
          do {
            prevIndex = Math.floor(Math.random() * playlist.length);
          } while (prevIndex === currentTrackIndex);
        } else {
          prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
        }

        playTrackByIndex(prevIndex);
      }

      // イベントリスナー設定 (コントロールボタン)
      btnPlayPause.addEventListener('click', togglePlayPause);
      minibarPlayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePlayPause();
      });
      btnStop.addEventListener('click', stopPlayback);
      btnNext.addEventListener('click', () => playNextTrack(false));
      btnPrev.addEventListener('click', playPrevTrack);

      // リピートトグル（同フォルダ内ループ / 終了時停止）
      btnRepeat.classList.toggle('toggle-active', isRepeat);
      btnRepeat.addEventListener('click', () => {
        isRepeat = !isRepeat;
        btnRepeat.classList.toggle('toggle-active', isRepeat);
        localStorage.setItem(STORAGE_KEY_REPEAT, isRepeat);
        showToast(isRepeat ? 'リピート: 有効（同フォルダ内ループ）' : 'リピート: 無効（終了時停止）');
      });

      // ジャケットタップ（左スキップ・右スキップ）
      touchPrev.addEventListener('click', (e) => {
        e.stopPropagation();
        playPrevTrack();
      });
      touchNext.addEventListener('click', (e) => {
        e.stopPropagation();
        playNextTrack(false);
      });

      // シャッフルトグル
      if (isShuffle) btnShuffle.classList.add('toggle-active');
      btnShuffle.addEventListener('click', () => {
        isShuffle = !isShuffle;
        btnShuffle.classList.toggle('toggle-active', isShuffle);
        localStorage.setItem(STORAGE_KEY_SHUFFLE, isShuffle);
        showToast(isShuffle ? 'シャッフル: ON' : 'シャッフル: OFF');
      });

      // 音量スライダー
      const savedVol = localStorage.getItem(STORAGE_KEY_VOL);
      if (savedVol !== null) {
        audio.volume = parseFloat(savedVol);
        volumeSlider.value = savedVol;
      } else {
        audio.volume = 0.8;
      }
      volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value;
        localStorage.setItem(STORAGE_KEY_VOL, e.target.value);
      });

      // シークバー操作
      seekSlider.addEventListener('input', () => {
        isSeeking = true;
        currentTimeEl.textContent = formatTime(seekSlider.value);
      });

      seekSlider.addEventListener('change', () => {
        audio.currentTime = seekSlider.value;
        isSeeking = false;
        savePlaybackState();
      });

      // Audio要素イベントリスナー登録関数
      function attachAudioEventListeners(targetAudio) {
        targetAudio.addEventListener('loadedmetadata', () => {
          seekSlider.max = targetAudio.duration || 100;
          totalTimeEl.textContent = formatTime(targetAudio.duration);
        });

        let lastSaveTime = 0;
        targetAudio.addEventListener('timeupdate', () => {
          if (!isSeeking) {
            seekSlider.value = targetAudio.currentTime;
            currentTimeEl.textContent = formatTime(targetAudio.currentTime);
          }

          // 1秒ごとに状態保存
          const now = Date.now();
          if (now - lastSaveTime > 1000) {
            lastSaveTime = now;
            savePlaybackState();
          }
        });

        // 曲終了時の自動曲送り (リピート判定連動)
        targetAudio.addEventListener('ended', () => {
          playNextTrack(true);
        });

        targetAudio.addEventListener('play', () => {
          updatePlayPauseUI(true);
          startVisualizer();
        });
        targetAudio.addEventListener('pause', () => updatePlayPauseUI(false));
      }

      // 初回オーディオ要素へのイベント登録
      attachAudioEventListeners(audio);

      // ==========================================================================
      // レジューム再生 & スリープ・リロード対策
      // ==========================================================================
      function savePlaybackState() {
        if (currentTrackIndex >= 0 && playlist[currentTrackIndex]) {
          const track = playlist[currentTrackIndex];
          localStorage.setItem(STORAGE_KEY_FILE, track.name);
          localStorage.setItem(STORAGE_KEY_TIME, audio.currentTime.toFixed(1));
        }
      }

      // visibilitychange / beforeunload で確実に保存 & バックグラウンド省電力化
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          savePlaybackState();
          // スリープ・バックグラウンド移行時は描画ループを停止してCPU負荷を完全にカット
          if (visualizerAnimId) {
            cancelAnimationFrame(visualizerAnimId);
            visualizerAnimId = null;
          }
        } else {
          // フォアグラウンド復帰時はビジュアライザー描画を再開
          startVisualizer();
          // リアルスペアナモードでAudioContextがiOSの省電力等で中断されている場合は自動再開
          if (audioMode === 'real' && audioCtx && audioCtx.state === 'suspended' && !audio.paused) {
            audioCtx.resume().catch(() => {});
          }
        }
      });
      window.addEventListener('beforeunload', () => {
        savePlaybackState();
      });

      // ミニバーのボタンを通常の「再生」ボタンに戻す
      function restoreMinibarToNormal() {
        minibarActionArea.innerHTML = '';
        minibarActionArea.appendChild(minibarPlayBtn);
      }

      // アプリ起動時のレジュームチェック
      function checkResumeState() {
        const lastFileName = localStorage.getItem(STORAGE_KEY_FILE);
        const lastTime = parseFloat(localStorage.getItem(STORAGE_KEY_TIME) || '0');

        if (lastFileName) {
          const dummyTrack = {
            name: lastFileName,
            title: cleanTrackName(lastFileName),
            trackNo: parseTrackNumberFromFilename(lastFileName)
          };
          const title = formatTrackDisplayTitle(dummyTrack);

          // ミニバーに前回の曲名と秒数を表示
          minibarTitle.textContent = title;
          minibarSub.textContent = `前回 ${formatTime(lastTime)} まで再生`;

          playerTitle.textContent = title;
          playerFolder.textContent = `前回の曲 (${formatTime(lastTime)}〜)`;

          // 右端ボタンを <label> による [ 📂 続きをロード ] ボタンに置き換え（フォルダ & クラウドファイル両対応）
          minibarActionArea.innerHTML = `
            <div style="display:flex;gap:6px;align-items:center;">
              <label for="resume-picker-input" class="resume-label-btn" title="フォルダから続きをロード（本体内 / PC）">
                <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                <span>フォルダ</span>
              </label>
              <label for="files-picker-input" class="resume-label-btn" title="ファイルから続きをロード（Google Drive / OneDrive対応）">
                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                <span>ファイル</span>
              </label>
            </div>
          `;
        }
      }

      // レジューム選択時の処理
      resumePickerInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
          handleLoadedFiles(e.target.files, true);
        }
      });

      // ==========================================================================
      // MediaSession API (ロック画面・バックグラウンド操作対応)
      // ==========================================================================
      function setupMediaSession(track) {
        if (!('mediaSession' in navigator)) return;

        const title = formatTrackDisplayTitle(track);
        const artist = track.artist || 'MokuPlay オフライン';
        const album = track.parentPath || 'MokuPlay';

        const artworkList = [];
        if (currentArtworkUrl) {
          artworkList.push({ src: currentArtworkUrl, sizes: '512x512' });
        } else {
          // 木目調アートワークのプレースホルダーSVG Data URL
          const artworkSvg = `
            <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
              <rect width="512" height="512" fill="#caa06d"/>
              <circle cx="256" cy="256" r="220" fill="#24160a"/>
              <circle cx="256" cy="256" r="100" fill="#caa06d"/>
              <circle cx="256" cy="256" r="30" fill="#24160a"/>
            </svg>
          `;
          artworkList.push({ src: `data:image/svg+xml;utf8,${encodeURIComponent(artworkSvg)}`, sizes: '512x512', type: 'image/svg+xml' });
        }

        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: artist,
          album: album,
          artwork: artworkList
        });

        navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrevTrack());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNextTrack(false));

        try {
          navigator.mediaSession.setActionHandler('seekto', (details) => {
            if (details.seekTime && !isNaN(details.seekTime)) {
              audio.currentTime = details.seekTime;
            }
          });
        } catch (e) {}
      }

      /* ==========================================================================
         【有料版向け機能】アプリ自身 (単一HTML) の端末ダウンロード保存 (完全オフライン起動用)
         ※ 購入者限定で開放する際は前後のコメントアウト(/* と * /)を解除してください
         ==========================================================================
      function downloadSelfApp() {
        try {
          // 現在のDOMをクローンして一時的なセッション状態（Blob URLなど）をクリーンアップ
          const docClone = document.documentElement.cloneNode(true);

          // 一時的なblob URLの参照を消去（次回ファイル起動時に無効なURLを参照しないように）
          const cloneAudio = docClone.querySelector('#audio-player');
          if (cloneAudio) {
            cloneAudio.removeAttribute('src');
          }
          const cloneArtwork = docClone.querySelector('#artwork-img');
          if (cloneArtwork) {
            cloneArtwork.removeAttribute('src');
            cloneArtwork.style.display = 'none';
          }
          const cloneThumb = docClone.querySelector('#minibar-thumb-img');
          if (cloneThumb) {
            cloneThumb.removeAttribute('src');
            cloneThumb.style.display = 'none';
          }
          const cloneThumbSvg = docClone.querySelector('#minibar-thumb-svg');
          if (cloneThumbSvg) {
            cloneThumbSvg.style.display = 'block';
          }
          const cloneVinyl = docClone.querySelector('#vinyl-disc');
          if (cloneVinyl) {
            cloneVinyl.style.display = 'flex';
          }

          // モーダルがもし開いていたら非表示状態にして保存
          const cloneModal = docClone.querySelector('#save-modal');
          if (cloneModal) {
            cloneModal.classList.remove('show');
          }

          // 完全なHTML文字列を作成 (DOCTYPE + outerHTML)
          const htmlContent = '<!DOCTYPE html>\n' + docClone.outerHTML;

          // Blob作成 & ダウンロード実行 (完全クライアントサイド・外部通信一切なし)
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'MokuPlay.html';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          setTimeout(() => {
            URL.revokeObjectURL(url);
          }, 4000);

          // 案内モーダルを表示 & トースト通知
          if (saveModal) {
            saveModal.classList.add('show');
          }
          showToast('💾 MokuPlay.html をダウンロードしました');
        } catch (err) {
          console.error('アプリ保存エラー:', err);
          showToast('保存中にエラーが発生しました: ' + (err.message || err));
        }
      }

      if (btnSaveApp) {
        btnSaveApp.addEventListener('click', downloadSelfApp);
      }

      if (btnSaveModalClose) {
        btnSaveModalClose.addEventListener('click', () => {
          if (saveModal) saveModal.classList.remove('show');
        });
      }

      if (saveModal) {
        saveModal.addEventListener('click', (e) => {
          if (e.target === saveModal) {
            saveModal.classList.remove('show');
          }
        });
      }
      ========================================================================== */

      // --- 起動時初期化 ---
      switchTab('list');
      updateAudioModeUI();
      startVisualizer();
      checkResumeState();

    })();
  </script>
</body>
